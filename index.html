// "2026-12-04" -> "2026-12-08" inclusive day count = 5
function tripDayCount(trip){
  if (!trip.travel_start || !trip.travel_end) return 0;
  const [ys,ms,ds] = trip.travel_start.split("-").map(Number);
  const [ye,me,de] = trip.travel_end.split("-").map(Number);
  const days = Math.round((new Date(ye,me-1,de) - new Date(ys,ms-1,ds)) / 86400000) + 1;
  return days > 0 ? days : 0;
}

function scopedTrips(){
  return trips.filter(t => {
    if (statsFilter === "all") return true;
    if (statsFilter === "ungrouped") return !t.folder_id;
    return t.folder_id === statsFilter;
  });
}

function renderStatsBar(){
  const scoped = scopedTrips();

  let totalDays = 0, flightCash = 0, rentalCash = 0;
  const flightPointsByProgram = new Map(), rentalPointsByProgram = new Map();
  const byCategory = new Map(); // category id (or "none") -> {cash, pointsByProgram}
  for (const t of scoped){
    totalDays += tripDayCount(t);
    const catKey = t.category_id || "none";
    if (!byCategory.has(catKey)) byCategory.set(catKey, { cash: 0, pointsByProgram: new Map() });
    const catBucket = byCategory.get(catKey);
    for (const f of (t.flights || [])){
      if (f.status === "watching") continue; // still comparing options — excluded from cost totals
      const n = f.passengers || 1;
      const cash = (f.paid_cash || 0) * n, points = (f.paid_points || 0) * n;
      flightCash += cash; catBucket.cash += cash;
      addPoints(flightPointsByProgram, f.points_program, points);
      addPoints(catBucket.pointsByProgram, f.points_program, points);
    }
    for (const r of (t.rentals || [])){
      if (r.status === "watching") continue;
      const cash = rentalOurPortion(r) || 0, points = r.paid_points || 0;
      rentalCash += cash; catBucket.cash += cash;
      addPoints(rentalPointsByProgram, r.points_program, points);
      addPoints(catBucket.pointsByProgram, r.points_program, points);
    }
  }
  const totalPointsByProgram = new Map();
  for (const [program, pts] of flightPointsByProgram) addPoints(totalPointsByProgram, program, pts);
  for (const [program, pts] of rentalPointsByProgram) addPoints(totalPointsByProgram, program, pts);

  // Cash on its own line, then each loyalty program's points stacked below
  // it — narrow stat cards read worse as one long comma-separated line.
  const costBlockHTML = (cash, pointsByProgram) => {
    const entries = sortedPointsEntries(pointsByProgram);
    if (!cash && !entries.length) return `<span class="stat-val">—</span>`;
    const cashHTML = cash ? `<span class="stat-val">${fmtCash(cash)}</span>` : "";
    const pointsHTML = entries.length
      ? `<div class="stat-points">${entries.map(([program, pts]) =>
          `<span>${fmtPoints(pts)}${program ? ` &middot; ${esc(program)}` : ""}</span>`).join("")}</div>`
      : "";
    return cashHTML + pointsHTML;
  };

  const sortedFolders = [...folders].sort((a,b) => a.position - b.position);
  const yearOptionsHTML = `
    <option value="all" ${statsFilter==="all"?"selected":""}>All trips</option>
    ${sortedFolders.map(f => `<option value="${f.id}" ${statsFilter===f.id?"selected":""}>${esc(f.title)}</option>`).join("")}
    <option value="ungrouped" ${statsFilter==="ungrouped"?"selected":""}>No year</option>`;

  const noneBucket = byCategory.get("none");
  const categoryOptionsHTML = `
    <option value="">All categories</option>
    ${categories.filter(c => byCategory.has(c.id))
      .map(c => `<option value="${c.id}" ${highlightCategoryId===c.id?"selected":""}>${esc(c.title)}</option>`).join("")}
    ${noneBucket ? `<option value="none" ${highlightCategoryId==="none"?"selected":""}>Uncategorized</option>` : ""}`;
  const selectedCatBucket = highlightCategoryId ? byCategory.get(highlightCategoryId) : null;

  return `
    <h2 class="summary-title">Yearly Summaries</h2>
    <div class="stats-bar">
      <div class="stat stat-filter">
        <span class="stat-label">Year</span>
        <select id="statsFilterSelect">${yearOptionsHTML}</select>
      </div>
      <div class="stat"><span class="stat-label">Trip days</span><span class="stat-val">${totalDays}</span></div>
      <div class="stat"><span class="stat-label">Flights</span>${costBlockHTML(flightCash, flightPointsByProgram)}</div>
      <div class="stat"><span class="stat-label">Rentals</span>${costBlockHTML(rentalCash, rentalPointsByProgram)}</div>
      <div class="stat stat-total"><span class="stat-label">Total cost</span>${costBlockHTML(flightCash+rentalCash, totalPointsByProgram)}</div>
      <div class="stat stat-filter">
        <span class="stat-label">Category</span>
        <select id="categoryHighlightSelect">${categoryOptionsHTML}</select>
        ${selectedCatBucket ? costBlockHTML(selectedCatBucket.cash, selectedCatBucket.pointsByProgram) : ""}
      </div>
    </div>`;
}

// The bookmarklet runs on the airline's own site, in a tab you opened
// yourself via a "Check price" link (so it's a real logged-in-as-you
// browsing session — no automation touches the airline page). It reads the
// flight id we stashed in the URL fragment, grabs whatever price text you
// highlighted (or falls back to a prompt), and hands off to this same
// original tab via a "#logprice=id&price=value" fragment, where the app
// (already authenticated) does the actual insert. The bookmarklet itself
// never touches Supabase or holds any credentials.
function renderBookmarkletPanel(){
  const fareBoardUrl = location.origin + location.pathname;
  const code = `javascript:(function(){var m=location.hash.match(/farelog=([^&]+)/);if(!m){alert('Open this page via a "Check price" link in Yes, Yes, with E-Kai You Travel first.');return;}var id=m[1];var sel=(window.getSelection?window.getSelection().toString():'')||'';var pm=sel.match(/[\\d,]+\\.?\\d*/);var price=pm?pm[0].replace(/,/g,''):prompt('Price shown on this page?');if(!price)return;window.open(${JSON.stringify(fareBoardUrl)}+'#logprice='+id+'&price='+encodeURIComponent(price),'farelog');})();`;
  return `
    <div class="watching-block" style="margin-bottom:20px">
      <b>Log price from your browser, one click</b>
      <p style="margin:6px 0">Drag this to your bookmarks bar:
        <a class="btn btn-sm" href="${esc(code)}" onclick="return false" style="cursor:grab">📌 Log price</a>
      </p>
      <p style="margin:6px 0">Then: click a flight's <b>Check price →</b> link to open the airline site, highlight
        the price on the page, and click the bookmark. It logs straight into that flight — no typing, no
        automation touching the airline's site.</p>
      <button class="btn-link" id="hideBookmarkletPanel">Got it, hide this</button>
    </div>`;
}

function renderCancelDeadlines(){
  const today = new Date(); today.setHours(0,0,0,0);
  const rows = [];
  for (const t of scopedTrips()){
    for (const r of (t.rentals || [])){
      if (!r.cancel_by || r.status === "watching") continue;
      const [y,m,d] = r.cancel_by.split("-").map(Number);
      const cancelDate = new Date(y, m-1, d);
      const daysLeft = Math.round((cancelDate - today) / 86400000);
      if (daysLeft < 0) continue; // window already passed
      rows.push({ trip: t, rental: r, daysLeft });
    }
  }
  if (!rows.length) return "";
  rows.sort((a,b) => a.daysLeft - b.daysLeft);

  const rowsHTML = rows.map(({ trip, rental, daysLeft }) => {
    const soon = daysLeft <= 30;
    return `<div class="cancel-row${soon ? " cancel-soon" : ""}" data-cal-goto="${trip.id}" data-rental-target="${rental.id}">
      <span class="cancel-date">${fmtShortDate(rental.cancel_by)}</span>
      <span class="cancel-days">${daysLeft === 0 ? "today" : daysLeft + "d left"}</span>
      <span class="cancel-label">${esc(rental.label)}</span>
      <span class="cancel-trip">${esc(trip.title)}</span>
    </div>`;
  }).join("");

  return `
    <div class="section-head">Upcoming cancel-by dates</div>
    <div class="cancel-list">${rowsHTML}</div>`;
}

const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function renderCalendarView(){
  const scoped = scopedTrips();
  const byYear = new Map();
  const undated = [];
  for (const t of scoped){
    const dateStr = t.travel_start || t.travel_end;
    if (!dateStr){ undated.push(t); continue; }
    const year = Number(dateStr.slice(0, 4));
    const month = Number(dateStr.slice(5, 7)) - 1;
    if (!byYear.has(year)) byYear.set(year, Array.from({ length: 12 }, () => []));
    byYear.get(year)[month].push(t);
  }
  if (!byYear.size && !undated.length) return "";

  const tripChip = t => {
    let cls = "cal-trip-chip";
    if (selectedTripIds.has(t.id)) cls += " selected";
    if (highlightCategoryId){
      const matches = highlightCategoryId === "none" ? !t.category_id : t.category_id === highlightCategoryId;
      cls += matches ? " cal-highlight" : " cal-dim";
    }
    return `<button type="button" class="${cls}" data-cal-goto="${t.id}">${esc(t.title)}</button>`;
  };

  const years = [...byYear.keys()].sort((a, b) => a - b);
  const yearBlocks = years.map(year => {
    const months = byYear.get(year);
    const collapsed = collapsedCalYears.has(year);
    const cells = months.map((tripsInMonth, i) => `
      <div class="cal-month-cell">
        <div class="cal-month-label">${MONTH_ABBR[i]}</div>
        ${tripsInMonth.length ? tripsInMonth.map(tripChip).join("") : `<span class="cal-month-empty">—</span>`}
      </div>`).join("");
    return `
      <div class="cal-year-block">
        <div class="cal-year-header" data-cal-year-toggle="${year}">
          <span class="cal-year-caret${collapsed ? " collapsed" : ""}">▾</span>
          <span class="cal-year-label">${year}</span>
        </div>
        ${collapsed ? "" : `<div class="cal-month-grid">${cells}</div>`}
      </div>`;
  }).join("");

  const undatedHTML = undated.length
    ? `<div class="cal-undated">Undated: ${undated.map(tripChip).join("")}</div>`
    : "";

  const bulkBar = bulkSelectMode ? `
    <div class="bulk-bar">
      <span class="bulk-bar-count">${selectedTripIds.size} selected</span>
      <select id="bulkCategorySelect">
        <option value="">Assign category…</option>
        ${categories.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join("")}
        <option value="__new__">+ New category…</option>
      </select>
      <button class="btn btn-sm" id="bulkApplyBtn">Apply</button>
      <button class="btn-link" id="bulkClearBtn">Clear selection</button>
    </div>` : "";

  return `<div class="calendar-view">${bulkBar}${yearBlocks}${undatedHTML}</div>`;
}

function renderTabs(){
  const byFolder = new Map();
  const ungrouped = [];
  for (const t of trips){
    if (t.folder_id){
      if (!byFolder.has(t.folder_id)) byFolder.set(t.folder_id, []);
      byFolder.get(t.folder_id).push(t);
    } else ungrouped.push(t);
  }
  const tabLabel = t => {
    const dateStr = t.travel_start || t.travel_end;
    if (!dateStr) return esc(t.title);
    const month = MONTH_ABBR[Number(dateStr.slice(5, 7)) - 1];
    return `${month} - ${esc(t.title)}`;
  };
  const tabBtn = t => `<button class="tab ${t.id===activeTripId?'active':''}"
      draggable="true" data-drag-tab="${t.id}" data-tab="${t.id}">${tabLabel(t)}</button>`;

  const sortedFolders = [...folders].sort((a,b) => a.position - b.position);
  const folderHTML = sortedFolders.map(f => {
    const tripsInFolder = (byFolder.get(f.id) || []).sort((a,b) => a.position - b.position);
    const collapsed = collapsedFolders.has(f.id);
    return `<div class="tab-folder" draggable="true" data-drag-folder="${f.id}" data-folder-drop="${f.id}">
      <div class="tab-folder-head" data-folder-toggle="${f.id}" title="Drag to reorder, click to expand/collapse">
        <span class="tab-folder-caret${collapsed ? " collapsed" : ""}">▾</span>
        <span class="tab-folder-label" data-folder-rename="${f.id}" title="Click to rename">${esc(f.title)}</span>
        <span class="tab-folder-del" data-folder-del="${f.id}" title="Delete year">×</span>
      </div>
      ${collapsed ? "" : `<span class="tab-folder-tabs">${tripsInFolder.map(tabBtn).join("")}</span>`}
    </div>`;
  }).join("");

  const sortedUngrouped = ungrouped.sort((a,b) => a.position - b.position);

  return `
    <div class="tabs">
      ${folderHTML}
      <div class="tab-ungrouped" data-folder-drop="">${sortedUngrouped.map(tabBtn).join("")}</div>
      <button class="tab tab-new" id="newTripTab" title="Add new trip">+ Add New Trip</button>
      <button class="tab tab-new-folder" id="newFolderTab" title="Add new year">+ Add New Year</button>
    </div>`;
}

function wireViewMenu(){

    // it's visible when entering select mode — otherwise there's nothing
    // to click.

// Native <details> doesn't close itself on an inside click or an outside
// click — wire both, once, at the document level (event delegation, so it
// keeps working across every render() that replaces the menu markup).
document.addEventListener("click", (e) => {
  document.querySelectorAll("details.menu[open]").forEach(d => {
    if (!d.contains(e.target) || e.target.closest(".menu-panel button, .menu-panel a")){
      d.removeAttribute("open");
    }
  });
});

function renderTripsSection(){
  document.getElementById("subtext").textContent =
    "Sites like Southwest block automated price lookups, so check prices yourself and log what you see.";

  const activeTrip = trips.find(t => t.id === activeTripId);
  const showImport = !!localStorage.getItem(OLD_LOCAL_KEY) && !localStorage.getItem(MIGRATED_FLAG);

  document.getElementById("loggedOutBrand").style.display = "none";
  document.getElementById("sidebar").innerHTML = renderSidebar(showImport);

  root.innerHTML = `
    ${bookmarkletPanelOpen ? renderBookmarkletPanel() : ""}

    ${renderStatsBar()}

    ${renderCancelDeadlines()}

    ${calendarVisible ? renderCalendarView() : ""}

    ${activeTrip ? renderTripPanel(activeTrip) :
      `<div class="empty-state">No trips yet. Click "+" to add your first one, or import saved data above.</div>`}
  `;

  document.getElementById("statsFilterSelect").addEventListener("change", (e) => {
    statsFilter = e.target.value;
    render();
  });

  document.querySelectorAll("[data-cal-year-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const year = Number(el.dataset.calYearToggle);
      if (collapsedCalYears.has(year)) collapsedCalYears.delete(year); else collapsedCalYears.add(year);
      localStorage.setItem(COLLAPSED_CAL_YEARS_KEY, JSON.stringify([...collapsedCalYears]));
      render();
    });
  });

  document.getElementById("categoryHighlightSelect").addEventListener("change", (e) => {
    highlightCategoryId = e.target.value || null;
    render();
  });

  document.querySelectorAll("[data-cal-goto]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.calGoto;
      if (bulkSelectMode){
        if (selectedTripIds.has(id)) selectedTripIds.delete(id); else selectedTripIds.add(id);
        render();
      } else {
        activeTripId = id;
        render();
      }
    });
  });

  // Cancel-deadline rows also jump straight to the specific rental card
  // (not just its trip) — runs after the data-cal-goto listener above has
  // already switched trips and re-rendered, so it queries the fresh DOM.
  document.querySelectorAll("[data-rental-target]").forEach(el => {
    el.addEventListener("click", () => {
      const rentalId = el.dataset.rentalTarget;
      requestAnimationFrame(() => {
        const card = document.querySelector(`[data-rental-card="${rentalId}"]`);
        if (!card) return;
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.classList.add("flash-highlight");
        setTimeout(() => card.classList.remove("flash-highlight"), 2000);
      });

// Shows a drag-to-position/zoom-to-crop overlay for `file`, cropped to a
// vw x vh viewport and exported at outW x outH. Resolves the cropped File,
// or null if the user cancels.
function openImageCropper(file, outW, outH, vw, vh){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const overlay = document.createElement("div");
      overlay.className = "crop-overlay";
      overlay.innerHTML = `
        <div class="crop-box">
          <div class="crop-viewport" style="width:${vw}px;height:${vh}px">
            <img src="${reader.result}">
          </div>
          <input type="range" class="crop-zoom" min="100" max="300" value="100">
          <div class="row" style="margin:0">
            <button type="button" class="btn btn-sm" data-crop-use>Use photo</button>
            <button type="button" class="btn-link" data-crop-cancel>Cancel</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const viewport = overlay.querySelector(".crop-viewport");
      const img = overlay.querySelector("img");
      const zoom = overlay.querySelector(".crop-zoom");
      let scale = 1, minScale = 1, offsetX = 0, offsetY = 0;
      let dragging = false, lastX = 0, lastY = 0;

      function applyTransform(){
        img.style.width = img.naturalWidth * scale + "px";
        img.style.height = img.naturalHeight * scale + "px";
        img.style.transform = `translate(${offsetX}px,${offsetY}px)`;
      }
      function clamp(){
        const iw = img.naturalWidth * scale, ih = img.naturalHeight * scale;
        offsetX = Math.min(0, Math.max(vw - iw, offsetX));
        offsetY = Math.min(0, Math.max(vh - ih, offsetY));
      }
      img.onload = () => {
        minScale = Math.max(vw / img.naturalWidth, vh / img.naturalHeight);
        scale = minScale;
        offsetX = (vw - img.naturalWidth * scale) / 2;
        offsetY = (vh - img.naturalHeight * scale) / 2;
        clamp();
        applyTransform();
      };

      function startDrag(x, y){ dragging = true; lastX = x; lastY = y; }
      function moveDrag(x, y){
        if (!dragging) return;
        offsetX += x - lastX; offsetY += y - lastY;
        lastX = x; lastY = y;
        clamp();
        applyTransform();
      }
      function endDrag(){ dragging = false; }

      viewport.addEventListener("mousedown", e => { startDrag(e.clientX, e.clientY); e.preventDefault(); });
      window.addEventListener("mousemove", e => moveDrag(e.clientX, e.clientY));
      window.addEventListener("mouseup", endDrag);
      viewport.addEventListener("touchstart", e => { const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, { passive: true });
      viewport.addEventListener("touchmove", e => { const t = e.touches[0]; moveDrag(t.clientX, t.clientY); }, { passive: true });
      viewport.addEventListener("touchend", endDrag);

      zoom.addEventListener("input", () => {
        const oldScale = scale;
        scale = minScale * (zoom.value / 100);
        const cx = vw / 2, cy = vh / 2;
        offsetX = cx - (cx - offsetX) * (scale / oldScale);
        offsetY = cy - (cy - offsetY) * (scale / oldScale);
        clamp();
        applyTransform();
      });

      function cleanup(result){ overlay.remove(); resolve(result); }
      overlay.querySelector("[data-crop-cancel]").addEventListener("click", () => cleanup(null));
      overlay.querySelector("[data-crop-use]").addEventListener("click", () => {
        const canvas = document.createElement("canvas");
        canvas.width = outW; canvas.height = outH;
        const ctx = canvas.getContext("2d");
        const sx = -offsetX / scale, sy = -offsetY / scale;
        const sw = vw / scale, sh = vh / scale;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        canvas.toBlob(blob => {
          const cropped = new File([blob], (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
          cleanup(cropped);
        }, "image/jpeg", 0.9);
      });
    };
    reader.readAsDataURL(file);
  });
}

// Wires a "Choose photo" button + paste-an-image support for one photo-picker
// field inside `container` (data-${prefix}-photo-picker/-preview/-browse/-photo).
// If `cropConfig` is set, every selected/pasted image is cropped to
// cropConfig.vw x cropConfig.vh (display) / outW x outH (export) before use.
// Returns { getFile() } — null until the user picks something new.
function setupPhotoField(container, { prefix, cropConfig, existingPath }){
  const picker = container.querySelector(`[data-${prefix}-photo-picker]`);
  const preview = container.querySelector(`[data-${prefix}-photo-preview]`);
  const browseBtn = container.querySelector(`[data-${prefix}-photo-browse]`);
  const input = container.querySelector(`[data-${prefix}-photo]`);
  let pendingFile = null;

  if (existingPath){
    wishlistSignedUrl(existingPath).then(url => {
      if (url && !pendingFile) preview.style.backgroundImage = `url("${url}")`;
    });
  }

  async function handleFile(file){
    if (!file) return;
    if (cropConfig){
      const cropped = await openImageCropper(file, cropConfig.outW, cropConfig.outH, cropConfig.vw, cropConfig.vh);
      if (!cropped) return;
      file = cropped;
    }
    pendingFile = file;
    preview.style.backgroundImage = `url("${URL.createObjectURL(file)}")`;
  }

  browseBtn.addEventListener("click", () => input.click());
  input.addEventListener("change", () => handleFile(input.files[0]));
  picker.addEventListener("paste", (e) => {
    const items = e.clipboardData?.items || [];
    for (const item of items){
      if (item.type.startsWith("image/")){
        e.preventDefault();
        handleFile(item.getAsFile());
        break;
      }
    }
  });

  return { getFile: () => pendingFile };
}

// Recomputes the "Selected: ..." estimate for a planning-status trip from
// whatever's currently checked, and paints it in place — no refresh()/render()
// round-trip, since this is purely a local scratchpad.
function updatePlanningEstimate(trip){
  const selected = planningSelections.get(trip.id) || new Set();
  let cash = 0, points = 0;
  for (const f of (trip.flights || [])){
    if (f.status !== "watching" || !selected.has(`flight:${f.id}`)) continue;
    const n = f.passengers || 1;
    cash += (f.paid_cash || 0) * n; points += (f.paid_points || 0) * n;
  }
  for (const r of (trip.rentals || [])){
    if (r.status !== "watching" || !selected.has(`rental:${r.id}`)) continue;
    cash += rentalOurPortion(r) || 0; points += r.paid_points || 0;
  }
  const parts = [];
  if (cash) parts.push(fmtCash(cash));
  if (points) parts.push(fmtPoints(points));
  const el = document.querySelector(`[data-plan-estimate="${trip.id}"]`);
  if (el) el.textContent = "Selected: " + (parts.length ? parts.join(" + ") : "—");
}

// Wires the plan-select checkboxes for one trip's panel: click toggles one,
// shift-click toggles every checkbox between the last-clicked one and this
// one (Finder-style range select), matching the DOM order the cards render in.
function wirePlanningSelection(trip){
  const boxes = Array.from(document.querySelectorAll(`[data-plan-check][data-plan-trip="${trip.id}"]`));
  let lastIndex = null;
  boxes.forEach((box, idx) => {
    box.addEventListener("click", (e) => {
      const set = planningSelections.get(trip.id) || new Set();
      planningSelections.set(trip.id, set);
      if (e.shiftKey && lastIndex !== null){
        const [start, end] = [lastIndex, idx].sort((a, b) => a - b);
        const shouldCheck = box.checked;
        for (let i = start; i <= end; i++){
          boxes[i].checked = shouldCheck;
          if (shouldCheck) set.add(boxes[i].dataset.planCheck); else set.delete(boxes[i].dataset.planCheck);
        }
      } else {
        if (box.checked) set.add(box.dataset.planCheck); else set.delete(box.dataset.planCheck);
      }
      lastIndex = idx;
      updatePlanningEstimate(trip);
    });
  });
}

      (activeTrip.flights || []).forEach(f => inScope(f.status) && f.url && window.open(f.url, `farecheck_${f.id}`));

function wireAddFlightForm(tripId){
  const holder = document.querySelector(`[data-add-flight-form="${tripId}"]`);

    dest: "[data-nf-dest]", date: "[data-nf-date]", time: "[data-nf-time]",
    paidCash: "[data-nf-paidcash]", paidPoints: "[data-nf-paidpoints]",
    label: "[data-nf-label]", leg: "[data-nf-leg]",
    returnDate: "[data-nf-return-date]", returnWrap: "[data-nf-return-wrap]" });
  saveBtn.addEventListener("click", async () => {
    const url = holder.querySelector("[data-nf-url]").value.trim();
    const origin = holder.querySelector("[data-nf-origin]").value.trim().toUpperCase() || null;
    const destination = holder.querySelector("[data-nf-dest]").value.trim().toUpperCase() || null;
    const departDate = holder.querySelector("[data-nf-date]").value || null;
    const departTime = holder.querySelector("[data-nf-time]").value || null;
    const leg = holder.querySelector("[data-nf-leg]").value || null;
    const returnDate = leg === "roundtrip" ? (holder.querySelector("[data-nf-return-date]").value || null) : null;
    const returnTime = leg === "roundtrip" ? (holder.querySelector("[data-nf-return-time]").value || null) : null;
    const pc = holder.querySelector("[data-nf-paidcash]").value;
    const pp = holder.querySelector("[data-nf-paidpoints]").value;
    const paidCash = pc === "" ? null : parseFloat(pc);
    const paidPoints = pp === "" ? null : parseFloat(pp);
    const passengers = parseInt(holder.querySelector("[data-nf-passengers]").value, 10) || 1;
    const label = holder.querySelector("[data-nf-label]").value.trim()
      || flightTitle(origin, destination, departDate, departTime, paidCash, paidPoints, leg, returnDate);
    if (!label) { alert("A title, or From/To airports to auto-generate one, is required."); return; }
    const currency = holder.querySelector("[data-nf-currency]").value.trim() || "USD";
    const ab = holder.querySelector("[data-nf-alert]").value;
    const notes = holder.querySelector("[data-nf-notes]").value.trim();
    await createFlight(tripId, {
      label, leg, url: url || null, currency, origin, destination, departDate, departTime,
      returnDate, returnTime, paidCash, paidPoints,
      pointsProgram: holder.querySelector("[data-nf-pointsprogram]").value.trim() || null,
      passengers,
      flightNumber: holder.querySelector("[data-nf-flightnumber]").value.trim() || null,
      confirmationCode: holder.querySelector("[data-nf-confirmation]").value.trim() || null,
      alertBelow: ab === "" ? null : parseFloat(ab),
      status: holder.querySelector("[data-nf-status]").value,
      notes
    });
    await refresh();
  });
  cancelBtn.addEventListener("click", () => { holder.innerHTML = ""; });
}

// ---------------- Attachments UI wiring ----------------

function openEditFormIfNeeded(kind, itemId){
  const formSel = kind === "flight" ? `[data-edit-form="${itemId}"]` : `[data-rental-edit-form="${itemId}"]`;
  let form = document.querySelector(formSel);
  if (!form){
    const editBtn = document.querySelector(
      kind === "flight" ? `[data-edit-flight="${itemId}"]` : `[data-edit-rental="${itemId}"]`);
    if (editBtn) editBtn.click();
    form = document.querySelector(formSel);
  }
  return form;
}

function applySuggestionToFlight(itemId, suggestion){
  const form = openEditFormIfNeeded("flight", itemId);
  if (!form) return;
  const setIfEmpty = (sel, val) => {
    const el = form.querySelector(sel);
    if (el && !el.value && val) el.value = val;
  };
  setIfEmpty("[data-f-date]", suggestion.date);
  setIfEmpty("[data-f-time]", suggestion.time);
  setIfEmpty("[data-f-flightnumber]", suggestion.flightNumber);
  setIfEmpty("[data-f-confirmation]", suggestion.confirmationCode);
}

function applySuggestionToRental(itemId, suggestion){
  const form = openEditFormIfNeeded("rental", itemId);
  if (!form) return;
  const el = form.querySelector("[data-er-confirmation]");
  if (el && !el.value && suggestion.confirmationCode) el.value = suggestion.confirmationCode;
}

function renderSuggestionBanner(kind, itemId, suggestion){
  const bits = [];
  if (suggestion.date) bits.push(`Date <b>${esc(fmtShortDate(suggestion.date))}</b>`);
  if (suggestion.time) bits.push(`Time <b>${esc(fmtTime(suggestion.time))}</b>`);
  if (kind === "flight" && suggestion.flightNumber) bits.push(`Flight <b>${esc(suggestion.flightNumber)}</b>`);
  if (suggestion.confirmationCode) bits.push(`Conf. <b>${esc(suggestion.confirmationCode)}</b>`);
  if (!bits.length) return "";
  return `
    <div class="att-suggest" data-att-suggest="${itemId}">
      <span>Detected from screenshot: ${bits.join(" &middot; ")}</span>
      <button class="btn btn-ghost btn-sm" data-att-apply="${itemId}">Apply to form</button>
      <button class="btn-link" data-att-dismiss="${itemId}">dismiss</button>
    </div>`;
}

function wireAttachments(){
  // Resolve signed URLs for every thumbnail (private bucket — no public URL).
  document.querySelectorAll("[data-att-img]").forEach(async (img) => {
    const path = img.dataset.attPath;
    const url = await attachmentSignedUrl(path);
    if (url) img.src = url;
  });

  document.querySelectorAll("[data-att-open]").forEach(img => {
    img.addEventListener("click", async () => {
      // Open the tab synchronously (still inside the click's user-gesture
      // trust window), then redirect it once the signed URL resolves —
      // opening after an `await` gets silently popup-blocked in most browsers.
      const newTab = window.open("", "_blank"); // no noopener: need the ref to redirect it below
      const attId = img.dataset.attOpen;
      const found = findAttachmentOwner(attId);
      if (!found) { newTab?.close(); return; }
      const url = await attachmentSignedUrl(found.attachment.storage_path);
      if (url && newTab) newTab.location.href = url;
      else newTab?.close();
    });
  });

  document.querySelectorAll("[data-att-view-text]").forEach(btn => {
    btn.addEventListener("click", () => {
      const attId = btn.dataset.attViewText;
      const found = findAttachmentOwner(attId);
      if (!found) return;
      const holder = document.querySelector(`[data-att-text-holder="${found.item.id}"]`);
      if (!holder) return;
      if (holder.innerHTML){ holder.innerHTML = ""; return; }
      const text = found.attachment.ocr_text;
      holder.innerHTML = `<div class="att-text-box">${esc(text || "No text extracted from this image.")}</div>`;
    });
  });

  document.querySelectorAll("[data-att-del]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const attId = btn.dataset.attDel;
      const found = findAttachmentOwner(attId);
      if (!found) return;
      if (!confirm("Delete this screenshot?")) return;
      await deleteAttachment(found.attachment);
      await refresh();
    });
  });

  document.querySelectorAll("[data-att-upload]").forEach(input => {
    input.addEventListener("change", () => {
      const file = input.files[0];
      if (file) handleAttachmentFile(input.dataset.attUpload, file);
    });
  });

  document.querySelectorAll("[data-att-picker]").forEach(picker => {
    // mousedown fires before focus changes, so this captures whether the box
    // was ALREADY focused going into this click. First click just focuses it
    // (ready to paste, shown via the amber focus ring) instead of immediately
    // grabbing the OS file dialog — clicking a focused box browses files.
    picker.addEventListener("mousedown", () => {
      picker.dataset.wasFocused = document.activeElement === picker ? "1" : "0";
    });
    picker.addEventListener("click", () => {
      if (picker.dataset.wasFocused === "1"){
        document.querySelector(`[data-att-upload="${picker.dataset.attPicker}"]`)?.click();
      }
    });
    picker.addEventListener("paste", (e) => {
      const items = e.clipboardData?.items || [];
      for (const item of items){
        if (item.type.startsWith("image/")){
          e.preventDefault();
          handleAttachmentFile(picker.dataset.attPicker, item.getAsFile());
          break;
        }
      }
    });
  });
}

// Shared by both the file-picker input and paste-an-image: uploads the
// screenshot, refreshes so its thumbnail appears immediately, then runs OCR
// and offers the extracted-field suggestion banner. `kindAndId` is
// "flight:id" or "rental:id" (matches the data-att-upload/-picker encoding).
async function handleAttachmentFile(kindAndId, file){
  const [kind, itemId] = kindAndId.split(":");
  const found = kind === "flight" ? findFlight(itemId) : findRental(itemId);
  const trip = found?.trip;
  if (!trip) return;
  const statusEl = document.querySelector(`[data-att-status="${itemId}"]`);
  if (statusEl) statusEl.textContent = "Uploading…";
  const att = await uploadAttachment(trip.id, kind, itemId, file);
  if (!att) { if (statusEl) statusEl.textContent = ""; return; }
  // Refresh now so the thumbnail appears right away; OCR runs after,
  // against fresh DOM nodes (render() just replaced the old ones).
  await refresh();
  const freshStatusEl = document.querySelector(`[data-att-status="${itemId}"]`);
  if (freshStatusEl) freshStatusEl.textContent = "Scanning screenshot for text…";
  try {
    const text = await runOcr(file, (m) => {
      if (freshStatusEl && m.status === "recognizing text"){
        freshStatusEl.textContent = `Scanning… ${Math.round((m.progress||0)*100)}%`;
      }
    });
    await saveAttachmentOcrText(att.id, text);
    const owner = findAttachmentOwner(att.id);
    if (owner) owner.attachment.ocr_text = text; // keep in-memory cache in sync, no full refresh
    const suggestion = parseScreenshotText(text);
    if (freshStatusEl) freshStatusEl.textContent = "";
    const suggestHolder = document.querySelector(`[data-att-suggest-holder="${itemId}"]`);
    if (suggestHolder){
      suggestHolder.innerHTML = renderSuggestionBanner(kind, itemId, suggestion);
      const applyBtn = document.querySelector(`[data-att-apply="${itemId}"]`);
      if (applyBtn) applyBtn.addEventListener("click", () => {
        if (kind === "flight") applySuggestionToFlight(itemId, suggestion);
        else applySuggestionToRental(itemId, suggestion);
      });
      const dismissBtn = document.querySelector(`[data-att-dismiss="${itemId}"]`);
      if (dismissBtn) dismissBtn.addEventListener("click", () => { suggestHolder.innerHTML = ""; });
    }
  } catch (err){
    if (freshStatusEl) freshStatusEl.textContent = "Couldn't scan image (saved anyway): " + err.message;
  }
}

// ---------------- Tab / folder drag and drop ----------------

let dragTripId = null;
let dragFolderId = null;

function wireTabDragEvents(){
  document.querySelectorAll("[data-drag-tab]").forEach(tab => {
    tab.addEventListener("dragstart", (e) => {
      dragTripId = tab.dataset.dragTab;
      dragFolderId = null;
      e.stopPropagation();
      e.dataTransfer.effectAllowed = "move";
    });
    tab.addEventListener("dragover", (e) => {
      e.preventDefault(); e.stopPropagation();
      if (dragFlightId || dragRentalId) tab.classList.add("drag-over");
    });
    tab.addEventListener("dragleave", () => tab.classList.remove("drag-over"));
    tab.addEventListener("drop", async (e) => {
      e.preventDefault(); e.stopPropagation();
      tab.classList.remove("drag-over");
      // A card dropped on a trip moves into it; anything else falls through
      // to the trip-reordering logic these handlers already did.
      const destTripId = tab.dataset.dragTab;
      if (dragFlightId || dragRentalId){
        const cardId = dragFlightId || dragRentalId;
        const isFlight = !!dragFlightId;
        const source = isFlight ? findFlight(cardId) : findRental(cardId);
        dragFlightId = null; dragRentalId = null;
        if (!source || source.trip.id === destTripId) return;
        await (isFlight ? moveFlightToTrip : moveRentalToTrip)(cardId, destTripId);
        await refresh();
        return;
      }
      if (!dragTripId || dragTripId === destTripId) return;
      const target = trips.find(t => t.id === destTripId);
      const dragged = trips.find(t => t.id === dragTripId);
      const targetFolderId = target.folder_id || null;
      if ((dragged.folder_id || null) !== targetFolderId){
        await moveTripToFolder(dragTripId, targetFolderId);
      } else {
        const siblings = trips
          .filter(t => t.id !== dragTripId && (t.folder_id || null) === targetFolderId)
          .sort((a,b) => a.position - b.position);
        const targetIndex = siblings.findIndex(t => t.id === destTripId);
        await reorderItem("trips", dragged, siblings, targetIndex);
      }
      dragTripId = null;
      await refresh();
    });
  });

  document.querySelectorAll("[data-folder-drop]").forEach(zone => {
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag-over"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", async (e) => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      const folderId = zone.dataset.folderDrop || null;
      if (dragTripId){
        await moveTripToFolder(dragTripId, folderId);
        dragTripId = null;
        await refresh();
      } else if (dragFolderId && folderId && dragFolderId !== folderId){
        const dragged = folders.find(f => f.id === dragFolderId);
        const siblings = folders.filter(f => f.id !== dragFolderId).sort((a,b) => a.position - b.position);
        const targetIndex = siblings.findIndex(f => f.id === folderId);
        await reorderItem("trip_folders", dragged, siblings, targetIndex);
        dragFolderId = null;
        await refresh();
      }
    });
  });

  document.querySelectorAll("[data-drag-folder]").forEach(handle => {
    handle.addEventListener("dragstart", (e) => {
      dragFolderId = handle.dataset.dragFolder;
      dragTripId = null;
      e.dataTransfer.effectAllowed = "move";
    });
  });
}

// ---------------- Drag and drop ----------------

let dragFlightId = null;
let dragRentalId = null;

function wireDragEvents(activeTrip){
  // `draggable` lives on the grip, so the browser's default drag image is just
  // that tiny glyph. Snapshot the whole card instead, from an off-screen clone
  // — the clone is what carries the translucency, since applying opacity to the
  // live card after dragstart can't change an already-taken snapshot.
  const useCardAsDragImage = (e, handle) => {
    const card = handle.closest(".card");
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.add("drag-ghost");
    ghost.style.width = `${rect.width}px`;
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, e.clientX - rect.left, e.clientY - rect.top);
    // The snapshot is taken synchronously, so the clone can go straight away.
    setTimeout(() => ghost.remove(), 0);
    // Deferred so it can't affect the snapshot above.
    setTimeout(() => card.classList.add("dragging"), 0);
  };

  document.querySelectorAll("[data-drag-handle]").forEach(handle => {
    handle.addEventListener("dragstart", (e) => {
      dragFlightId = handle.dataset.dragHandle;
      dragRentalId = null;
      e.dataTransfer.effectAllowed = "move";
      useCardAsDragImage(e, handle);
    });
  });
  document.querySelectorAll("[data-rental-drag]").forEach(handle => {
    handle.addEventListener("dragstart", (e) => {
      dragRentalId = handle.dataset.rentalDrag;
      dragFlightId = null;
      e.dataTransfer.effectAllowed = "move";
      useCardAsDragImage(e, handle);
    });
  });
  // Without this an abandoned drag leaves its id set, and the next unrelated
  // drop acts on a card the user is no longer dragging.
  document.querySelectorAll("[data-drag-handle],[data-rental-drag]").forEach(handle => {
    handle.addEventListener("dragend", () => {
      dragFlightId = null; dragRentalId = null;
      handle.closest(".card")?.classList.remove("dragging");
    });
  });

  // Every lane advertises what it holds, so one code path can answer "may this
  // card land here?" and "what are its siblings once it does?".
  const zoneOf = el => el?.closest(".drop-zone");
  const zoneInfo = zone => ({
    kind: zone.dataset.dropKind,
    status: zone.dataset.dropStatus,
    leg: zone.dataset.dropLeg,
    rentalKind: zone.dataset.dropRentalKind,
  });

  // Siblings are scoped by status AND lane. Scoping by lane alone (the old
  // behaviour) mixed booked and watching rows into one position sequence, so
  // reordering inside Watching was computed against booked cards too.
  const siblingsFor = (z, excludeId) => {
    if (z.kind === "flight"){
      return (activeTrip.flights || [])
        .filter(f => f.id !== excludeId
          && (f.status || "booked") === z.status
          && (z.leg === "any" || legScope(f.leg) === z.leg))
        .sort((a,b) => a.position - b.position);
    }
    return (activeTrip.rentals || [])
      .filter(r => r.id !== excludeId
        && (r.status || "booked") === z.status
        && (r.kind || "housing") === z.rentalKind)
      .sort((a,b) => a.position - b.position);
  };

  // A drop is legal when it stays in the same lane type. Crossing sections
  // (booked <-> watching) is the point; crossing leg or rental kind is not,
  // so those are rejected rather than silently rewriting the record.
  const canAccept = (z, item) => {
    if (z.kind === "flight"){
      if (!dragFlightId) return false;
      return z.leg === "any" || legScope(item.leg) === z.leg;
    }
    if (!dragRentalId) return false;
    return (item.kind || "housing") === z.rentalKind;
  };

  const applyDrop = async (zone, targetId) => {
    const z = zoneInfo(zone);
    const isFlight = z.kind === "flight";
    const dragId = isFlight ? dragFlightId : dragRentalId;
    if (!dragId || dragId === targetId) return;
    const found = isFlight ? findFlight(dragId) : findRental(dragId);
    const item = isFlight ? found?.flight : found?.rental;
    if (!item || !canAccept(z, item)) return;

    const table = isFlight ? "flights" : "rentals";
    if ((item.status || "booked") !== z.status){
      await (isFlight ? updateFlight : updateRental)(dragId, { status: z.status });
      item.status = z.status; // keep the local copy in step for the reorder below
    }
    const siblings = siblingsFor(z, dragId);
    const targetIndex = targetId
      ? siblings.findIndex(s => s.id === targetId)
      : siblings.length;
    await reorderItem(table, item, siblings, targetIndex < 0 ? siblings.length : targetIndex);
    dragFlightId = null; dragRentalId = null;
    await refresh();
  };

  document.querySelectorAll("[data-card],[data-rental-card]").forEach(card => {
    card.addEventListener("dragover", (e) => { e.preventDefault(); card.classList.add("drag-over"); });
    card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
    card.addEventListener("drop", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      card.classList.remove("drag-over");
      const zone = zoneOf(card);
      if (!zone) return;
      await applyDrop(zone, card.dataset.card || card.dataset.rentalCard);
    });
  });

  document.querySelectorAll(".drop-zone").forEach(zone => {
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag-over"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", async (e) => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      await applyDrop(zone, null); // dropped in empty space -> append
    });
  });
}

// Picks up after the price-logging bookmarklet (see renderBookmarkletPanel)
// hands off via "#logprice=<flightId>&price=<value>" — logs the price
// straight in, no form to fill out. Requires trips to already be loaded.
async function processBookmarkletHash(){
  const m = location.hash.match(/logprice=([^&]+)&price=([^&]+)/);
  if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  const [, flightId, priceStr] = m;
  const price = parseFloat(priceStr);
  if (isNaN(price)) return;
  const found = findFlight(flightId);
  if (!found){ alert("Couldn't find that flight — it may have been moved or deleted."); return; }
  await addPriceLog(flightId, new Date().toISOString().slice(0,10), price);
  activeTripId = found.trip.id;
  await refresh();
  alert(`Logged ${fmtCash(price)} for "${found.flight.label}".`);
}

// ---------------- Init ----------------

supabase.auth.onAuthStateChange((event, newSession) => {
  if (event === "PASSWORD_RECOVERY"){ authMode = "reset"; render(); return; }
  const prevUserId = session?.user?.id || null;
  session = newSession;
  const nextUserId = newSession?.user?.id || null;
  // Same user still signed in (or still signed out): this is a background
  // token refresh (e.g. Supabase re-validates on tab focus), not a real
  // sign-in/out — don't re-render, or any open add/edit form gets wiped.
  if (nextUserId === prevUserId) return;
  if (session) refresh(); else render();
});

// The bookmarklet reuses one named tab, so repeat clicks often just change
// the hash on an already-loaded page (no reload) — catch those too.
window.addEventListener("hashchange", () => { if (session) processBookmarkletHash(); });

const { data: { session: initSession } } = await supabase.auth.getSession();
session = initSession;
if (session){ await refresh(); await processBookmarkletHash(); }
else render();
</script>
