<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yes, Yes, with E-Kai You Travel</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0F1626; --panel:#161F33; --panel2:#1C2740; --line:#243049;
    --amber:#FFB84D; --ink:#E9EEF6; --muted:#8B97AD;
    --good:#5CE0A1; --bad:#F08A8A; --btn-ink:var(--night);
  }
  :root[data-skin="ocean"]{
    --night:#071A24; --panel:#0E2530; --panel2:#123240; --line:#1D4152;
    --amber:#4FD8EB; --ink:#E4F6FA; --muted:#7FAAB8;
    --good:#5CE0A1; --bad:#F08A8A;
  }
  :root[data-skin="forest"]{
    --night:#0E1912; --panel:#15271C; --panel2:#1B3325; --line:#2A4636;
    --amber:#8CE07A; --ink:#E7F3E9; --muted:#8DAE93;
    --good:#7FE0C6; --bad:#F0938A;
  }
  :root[data-skin="sunset"]{
    --night:#1D1220; --panel:#2A1B2E; --panel2:#35223B; --line:#4A2E52;
    --amber:#FF8F6B; --ink:#F7ECEF; --muted:#B58FA0;
    --good:#8CE0A6; --bad:#FF7A9A;
  }
  :root[data-skin="paper"]{
    --night:#F6F4EF; --panel:#FFFFFF; --panel2:#F0EDE5; --line:#DDD8CC;
    --amber:#C6741A; --ink:#1C2536; --muted:#6B7280;
    --good:#1E9E63; --bad:#D64545; --btn-ink:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--night);color:var(--ink);font-family:Inter,system-ui,sans-serif;margin:0}
  .brand-row{display:flex;align-items:center;gap:12px;margin:32px auto;max-width:1000px;padding:0 20px}
  .brand-logo-lg{width:220px;max-width:60vw;height:auto;flex-shrink:0;display:block}
  .brand-text{display:flex;flex-direction:column;gap:2px;min-width:0}

  .app-shell{display:flex;align-items:stretch;min-height:100vh}
  .sidebar{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:22px 16px;gap:22px}
  .sidebar:empty{display:none}
  .sidebar-brand{display:flex;align-items:center;gap:10px}
  .sidebar-nav{display:flex;flex-direction:column;gap:2px}
  .sidebar-nav-item{display:flex;align-items:center;gap:8px;background:transparent;border:none;
      color:var(--muted);padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer;text-align:left}
  .sidebar-nav-item:hover{background:var(--panel2);color:var(--ink)}
  .sidebar-nav-item.active{background:var(--panel2);color:var(--amber);font-weight:600}
  .sidebar-trips{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .sidebar-section-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
      padding:0 10px}
  .sidebar-account{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  @media (max-width:820px){
    .app-shell{flex-direction:column}
    .sidebar{width:auto;border-right:none;border-bottom:1px solid var(--line)}
    .sidebar-trips{max-height:180px}
  }
  #root{flex:1;min-width:0;padding:32px 36px 64px;max-width:1320px}
  @media (max-width:640px){ #root{padding:20px 16px 48px} }
  .brand-logo{width:170px;max-width:100%;height:auto;display:block}
  .sub{color:var(--muted);font-size:13px;line-height:1.4}

  .menu{position:relative}
  .menu > summary{list-style:none;cursor:pointer}
  .menu > summary::-webkit-details-marker{display:none}
  .menu-panel{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);
      border:1px solid var(--line);border-radius:12px;padding:6px;min-width:210px;
      display:flex;flex-direction:column;gap:2px;z-index:30;
      box-shadow:0 10px 28px rgba(0,0,0,.35)}
  :root[data-skin="paper"] .menu-panel{box-shadow:0 10px 28px rgba(0,0,0,.12)}
  .menu-panel button, .menu-panel label{width:100%;text-align:left}
  .menu-panel button{background:transparent;border:none;color:var(--ink);
      padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit}
  .menu-panel button:hover{background:var(--panel2)}
  .menu-panel button.menu-danger{color:var(--muted)}
  .menu-panel button.menu-danger:hover{background:transparent;color:var(--bad)}
  .card-menu summary{font-weight:600}
  .card-menu .menu-panel{min-width:180px}
  .sidebar-account .menu-panel{top:auto;bottom:calc(100% + 6px);left:0;right:0}
  .search-trip-menu .menu-panel{left:0;right:auto;white-space:nowrap}
  .view-menu .menu-panel{left:0;right:auto;white-space:nowrap}
  .hamburger-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
      flex-shrink:0;border-radius:9px;border:1px solid var(--line);background:transparent;
      color:var(--ink);font-size:16px;cursor:pointer}
  .hamburger-btn:hover{border-color:var(--amber);color:var(--amber)}
  .menu-email{padding:6px 10px 8px;font-size:12px;color:var(--muted);
      border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}
  .menu-label{display:flex;flex-direction:column;gap:3px;padding:6px 10px;font-size:11px;
      color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .menu-divider{border-top:1px solid var(--line);margin:4px 2px}
  .avatar-circle{width:30px;height:30px;border-radius:50%;background:var(--panel2);
      border:1px solid var(--line);color:var(--amber);display:flex;align-items:center;
      justify-content:center;font-size:13px;font-weight:600;font-family:'Roboto Mono',monospace}
  .btn{display:inline-block;background:var(--amber);color:var(--btn-ink);font-weight:700;
       text-decoration:none;padding:10px 20px;border-radius:999px;font-size:14px;border:none;
       cursor:pointer;box-shadow:0 2px 10px color-mix(in srgb, var(--amber) 35%, transparent);
       transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px color-mix(in srgb, var(--amber) 45%, transparent)}
  .btn:active{transform:translateY(0)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber);box-shadow:none}
  .btn-sm{padding:6px 14px;font-size:12.5px}
  .btn-link{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12.5px;padding:2px 4px}
  .btn-link:hover{color:var(--bad)}
  .err{color:var(--bad);font-size:13px;margin:6px 0}
  .msg{color:var(--good);font-size:13px;margin:6px 0}

  /* Auth */
  .auth-wrap{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--line);
      border-radius:14px;padding:28px}
  .auth-wrap h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:21px;margin-bottom:16px;color:var(--amber)}
  .auth-wrap label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;
      letter-spacing:.06em;margin:12px 0 4px;font-family:'Roboto Mono',monospace}
  .auth-wrap input{width:100%}
  .auth-switch{margin-top:16px;font-size:13px;color:var(--muted)}
  .auth-switch button{background:none;border:none;color:var(--amber);cursor:pointer;font-size:13px;
      text-decoration:underline;padding:0}

  /* Sidebar trip list (vertical — was a horizontal tab strip pre-sidebar) */
  .tabs{display:flex;flex-direction:column;gap:2px}
  .tab{background:transparent;border:none;color:var(--muted);padding:8px 10px;font-size:13.5px;
      font-family:'Roboto Mono',monospace;cursor:pointer;border-radius:9px;text-align:left;
      width:100%;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab.active{color:var(--amber);background:var(--panel2);font-weight:600}
  .tab:hover{color:var(--ink);background:var(--panel2)}
  .tab-new{color:var(--muted);font-size:14px;padding:8px 10px;text-align:left}
  .tab-new-folder{color:var(--muted);font-size:13px;padding:8px 10px;white-space:nowrap;text-align:left}
  .tab-folder{display:flex;flex-direction:column;gap:2px;border:1px dashed var(--line);
      border-radius:9px;padding:6px}
  .tab-folder.drag-over{border-color:var(--amber)}
  .tab-folder-head{display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:grab;
      user-select:none;border-radius:6px}
  .tab-folder-head:hover{background:var(--panel2)}
  .tab-folder-caret{color:var(--muted);font-size:10px;flex-shrink:0;display:inline-block;
      transition:transform .15s ease}
  .tab-folder-caret.collapsed{transform:rotate(-90deg)}
  .tab-folder-label{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--muted);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .tab-folder-label:hover{color:var(--amber)}
  .tab-folder-del{color:var(--muted);cursor:pointer;font-size:13px;padding:0 4px;flex-shrink:0}
  .tab-folder-del:hover{color:var(--bad)}
  .tab-folder-tabs{display:flex;flex-direction:column;gap:2px;padding-left:6px}
  .tab-ungrouped{display:flex;flex-direction:column;gap:2px}
  .tab-ungrouped.drag-over{outline:1px dashed var(--amber);border-radius:9px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .panel-head h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;flex:1;min-width:120px}
  .title-input{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;
      background:var(--night);border:1px solid var(--amber);color:var(--ink);
      padding:4px 8px;border-radius:9px;flex:1;min-width:120px}

  .totals{font-family:'Roboto Mono',monospace;font-size:19px;font-weight:600;color:var(--amber);
      background:var(--night);border:1px solid var(--line);border-radius:12px;
      padding:12px 16px;margin:12px 0 16px;box-shadow:inset 5px 0 0 0 var(--amber)}

  .watch-badge{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:20px;
      padding:2px 8px;white-space:nowrap}

  .watching-block{font-size:13px;color:var(--muted);background:var(--night);
      border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0 16px}
  .planning-estimate{font-family:'Roboto Mono',monospace;font-size:15px;color:var(--amber);margin-top:4px}

  .plan-select-wrap{display:flex;align-items:flex-start;gap:8px}
  .plan-select-wrap > div{flex:1;min-width:0}
  .plan-checkbox{padding-top:14px}
  .plan-checkbox input{width:16px;height:16px;cursor:pointer}

  /* Flights carry the most detail (trend chart + history table), so they get
     a full-width lane of their own; housing and cars share the row below. */
  .lane-stack{display:flex;flex-direction:column;gap:16px}
  .lane-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:900px){ .lane-grid{grid-template-columns:1fr} }
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:14px;display:flex;flex-direction:column;gap:16px}
  .lane.lane-warn{border-color:var(--bad);box-shadow:inset 5px 0 0 0 var(--bad);
      background:color-mix(in srgb, var(--bad) 8%, var(--panel))}
  .lane-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;
      color:var(--muted);font-family:Inter,system-ui,sans-serif}
  /* Illustrated icons carry more detail than the old flat glyphs, so they
     need a bit more room to stay legible. */
  .cat-icon{width:26px;height:26px;vertical-align:-8px;flex-shrink:0}

  .summary-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;
      color:var(--ink);margin:0 0 12px;letter-spacing:.01em}
  .stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:10px 16px;min-width:120px}
  .stat-label{display:block;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;
      letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .stat-val{font-family:'Poppins',sans-serif;font-size:18px;font-weight:600;color:var(--ink)}
  .stat-points{display:flex;flex-direction:column;gap:1px;margin-top:3px;
      font-family:'Poppins',sans-serif;font-size:11.5px;color:var(--muted)}
  .stat.stat-total{background:var(--amber);border-color:var(--amber);
      box-shadow:0 4px 16px color-mix(in srgb, var(--amber) 30%, transparent)}
  .stat.stat-total .stat-label{color:color-mix(in srgb, var(--btn-ink) 75%, transparent)}
  .stat.stat-total .stat-val{color:var(--btn-ink);font-size:24px;font-weight:700}
  .stat.stat-total .stat-points{color:color-mix(in srgb, var(--btn-ink) 75%, transparent)}
  .stat.stat-filter{display:flex;align-items:center;gap:8px}

  .cancel-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
  .cancel-row{display:flex;align-items:center;gap:12px;background:var(--panel);
      border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-size:13px}
  .cancel-row:hover{border-color:var(--amber)}
  .cancel-row.cancel-soon{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 12%, var(--panel))}
  .cancel-date{font-family:'Roboto Mono',monospace;color:var(--ink);min-width:70px}
  .cancel-days{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--muted);
      min-width:64px}
  .cancel-row.cancel-soon .cancel-days{color:var(--amber);font-weight:600}
  .cancel-label{color:var(--ink);flex:1;min-width:0}
  .cancel-trip{color:var(--muted);font-size:12px;white-space:nowrap}

  .calendar-view{margin-bottom:20px}
  .cal-year-block{margin-bottom:14px}
  .cal-year-block:last-child{margin-bottom:0}
  .cal-year-header{display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:8px;
      user-select:none}
  .cal-year-label{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--amber);
      letter-spacing:.05em}
  .cal-year-caret{color:var(--amber);font-size:11px;display:inline-block;
      transition:transform .15s ease}
  .cal-year-caret.collapsed{transform:rotate(-90deg)}
  .cal-month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media (max-width:640px){ .cal-month-grid{grid-template-columns:repeat(2,1fr)} }
  .cal-month-cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:8px 10px;min-height:56px}
  .cal-month-label{font-size:11px;color:var(--muted);text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:6px;font-family:'Roboto Mono',monospace}
  .cal-trip-chip{display:block;width:100%;text-align:left;background:var(--panel2);
      border:1px solid var(--line);color:var(--ink);font-size:12px;padding:3px 8px;
      border-radius:9px;margin-bottom:4px;cursor:pointer;font-family:'Roboto Mono',monospace}
  .cal-trip-chip:last-child{margin-bottom:0}
  .cal-trip-chip:hover{border-color:var(--amber);color:var(--amber)}
  .cal-trip-chip.selected{border-color:var(--amber);background:var(--amber);color:var(--btn-ink)}
  .cal-trip-chip.cal-highlight{border-color:var(--amber);background:var(--amber);color:var(--btn-ink)}
  .cal-trip-chip.cal-dim{opacity:.35}
  .cal-month-empty{font-size:12px;color:var(--muted)}
  .cal-undated{font-size:12px;color:var(--muted);margin-top:2px}
  .cal-undated .cal-trip-chip{display:inline-block;width:auto;margin:0 6px 4px 0}
  .bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
      border:1px solid var(--amber);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:13px}
  .bulk-bar-count{color:var(--muted);font-family:'Roboto Mono',monospace;font-size:12px}

  .meta-block{background:var(--night);border:1px solid var(--line);border-radius:12px;
      padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--muted)}
  .meta-block b{color:var(--ink)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .tag{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
      padding:2px 10px;font-size:12px}

  .share-block{margin-bottom:16px}
  .collab-list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .collab-chip{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
      padding:3px 6px 3px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px}

  .pair-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .watch-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .leg-tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
           font-weight:500;margin-bottom:6px;font-family:Inter,system-ui,sans-serif}
  .leg-col{min-height:20px}
  .solo-list{display:flex;flex-direction:column;gap:16px}
  @media (max-width:900px){ .pair-row,.watch-grid{grid-template-columns:1fr} }

  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 20px;
      min-height:104px}
  .card.card-booked{border-color:var(--good);box-shadow:inset 5px 0 0 0 var(--good);
      background:color-mix(in srgb, var(--good) 8%, var(--panel2))}
  .card.card-watching{border-color:var(--amber);box-shadow:inset 5px 0 0 0 var(--amber);
      background:color-mix(in srgb, var(--amber) 9%, var(--panel2))}
  .card.drag-over{border-color:var(--amber)}
  /* The off-screen clone the browser snapshots as the drag image. Parked far
     off-canvas so it never flashes on screen before the snapshot is taken. */
  .drag-ghost{position:fixed;top:-10000px;left:-10000px;pointer-events:none;
      opacity:.75;border-color:var(--amber);box-shadow:0 12px 28px rgba(0,0,0,.4)}
  /* The card left behind, dimmed so the one under the cursor reads as the
     real thing. */
  .card.dragging{opacity:.4}
  .card.flash-highlight{animation:flash-highlight 2s ease-out}
  @keyframes flash-highlight{
    0%, 15%{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb, var(--amber) 35%, transparent)}
    100%{border-color:var(--line);box-shadow:0 0 0 0 transparent}
  }
  .card h3{font-size:15px;font-weight:600;margin-bottom:4px}
  .drag-handle{cursor:grab;color:var(--muted);font-size:13px;margin-right:6px;user-select:none}
  .card-title-row{display:flex;align-items:center;gap:8px}
  .card-title-row h3{min-width:0;overflow:hidden;display:-webkit-box;
      -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .meta-line{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-family:'Roboto Mono',monospace;line-height:1.6}
  .meta-line b{color:var(--ink);font-weight:600}
  .notes{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

  .wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
  .wishlist-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
      overflow:hidden;display:flex;flex-direction:column}
  .wishlist-photo{width:100%;height:280px;background:var(--night) center/cover no-repeat}
  .wishlist-card-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
  .wishlist-author{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .wishlist-avatar{display:inline-block;width:24px;height:24px;border-radius:50%;flex-shrink:0;
      background:var(--night) center/cover no-repeat;border:1px solid var(--line)}
  .wishlist-author-name{font-size:12px;color:var(--muted);font-family:'Roboto Mono',monospace}
  .wishlist-card h3{font-size:16px;font-weight:600;margin:0}
  .wishlist-location{font-size:12.5px;color:var(--muted)}
  .wishlist-blurb{font-size:13px;color:var(--ink);line-height:1.5}
  .wishlist-todo{font-size:12.5px;color:var(--muted);padding-left:18px;margin:4px 0}
  .wishlist-todo li{margin-bottom:2px}

  .photo-picker{border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;
      align-items:center;gap:10px;cursor:text}
  .photo-picker:focus, .photo-picker:focus-within{outline:none;border-color:var(--amber)}
  .photo-picker-preview{width:48px;height:48px;border-radius:9px;flex-shrink:0;
      background:var(--night) center/cover no-repeat;border:1px solid var(--line)}
  .photo-picker-avatar-preview{border-radius:50%}
  .photo-picker-actions{display:flex;flex-direction:column;gap:2px}
  .photo-picker-hint{font-size:11.5px;color:var(--muted)}

  .crop-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;
      display:flex;align-items:center;justify-content:center}

<script type="module">
// jsDelivr primary, esm.sh fallback — some networks/CDN edges fail one or the other.
let createClient;
try {
  ({ createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'));
} catch {
  ({ createClient } = await import('https://esm.sh/@supabase/supabase-js@2'));
}

// These are intentionally public (standard Supabase client pattern) —
// Row Level Security is what actually protects the data.
const SUPABASE_URL = "https://mmqcbjgftpwzaughimkr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_OU7_hsa5kefA2SDizMneeg_RjqASdUZ";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const root = document.getElementById("root");
const uid = () => crypto.randomUUID();

const OLD_LOCAL_KEY = "flight-tracker-dashboard-v1";
const MIGRATED_FLAG = "flight-tracker-migrated";
const SKIN_KEY = "flight-tracker-skin";

const SKINS = [
  { id: "amber", label: "Amber Night" },
  { id: "ocean", label: "Ocean Deep" },
  { id: "forest", label: "Forest Canopy" },
  { id: "sunset", label: "Sunset Ember" },
  { id: "paper", label: "Paper Light" },
];

function applySkin(id){
  document.documentElement.dataset.skin = id;
}

let currentSkin = localStorage.getItem(SKIN_KEY) || "amber";
applySkin(currentSkin);


const COLLAPSED_CAL_YEARS_KEY = "flight-tracker-collapsed-cal-years";
let collapsedCalYears = new Set(JSON.parse(localStorage.getItem(COLLAPSED_CAL_YEARS_KEY) || "[]"));

const COLLAPSED_FOLDERS_KEY = "flight-tracker-collapsed-folders";
let collapsedFolders = new Set(JSON.parse(localStorage.getItem(COLLAPSED_FOLDERS_KEY) || "[]"));

const CALENDAR_VISIBLE_KEY = "flight-tracker-calendar-visible";
let calendarVisible = localStorage.getItem(CALENDAR_VISIBLE_KEY) === "1";

let bulkSelectMode = false;
let selectedTripIds = new Set();

let bookmarkletPanelOpen = false;

let highlightCategoryId = null; // null = none; "none" = uncategorized; else a category id

// Ad-hoc "what would this combination cost" scratchpad for planning-status
// trips — trip.id -> Set of "flight:id"/"rental:id" keys. Never persisted;
// resets on reload, survives re-renders since it's a module-level var.
let planningSelections = new Map();

const SECTION_KEY = "flight-tracker-section";
let activeSection = localStorage.getItem(SECTION_KEY) || "trips"; // "trips" | "wishlist"

let session = null;
let trips = [];
let folders = [];
let categories = [];
let favoritePrograms = new Set();
let activeTripId = null;

let wishlistBoards = [];
let activeWishlistBoardId = null;
let wishlistProfiles = new Map(); // user_id -> {display_name, avatar_path}
let wishlistLoaded = false;
let statsFilter = "all"; // "all" | "ungrouped" | a folder id
let authMode = "login"; // login | signup | forgot | reset
let authError = "", authMsg = "";

const fmtCash = (n, cur="USD") =>
  new Intl.NumberFormat("en-US",{style:"currency",currency:cur}).format(n);
const fmtPoints = n => `${Number(n).toLocaleString()} pts`;
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Category icons (flight/hotel/car) — illustrated to match the site logo,
// used wherever the app used to show a plain emoji. Kept as <img> rather
// than inline SVG so the browser caches one copy across every card.
const ICON_FLIGHT = `<img class="cat-icon" src="icon-flight.png" alt="" aria-hidden="true">`;
const ICON_HOTEL = `<img class="cat-icon" src="icon-hotel.png" alt="" aria-hidden="true">`;
const ICON_CAR = `<img class="cat-icon" src="icon-car.png" alt="" aria-hidden="true">`;

// Curated loyalty-program lists for the points-program pickers — "Other…"
// always remains an option, so an unlisted program (e.g. a credit card's
// transferable-points program) is never a dead end.
const AIRLINE_PROGRAMS = ["Southwest", "United", "American", "Delta", "Alaska", "JetBlue", "Hawaiian", "Spirit", "Frontier"];
const HOTEL_PROGRAMS = ["IHG", "Hilton", "Marriott", "Choice Hotels"];

// "22,000 pts" or, when a loyalty program is set, "22,000 pts (Southwest)".
const pointsText = (n, program) => fmtPoints(n) + (program ? ` (${esc(program)})` : "");

// Favorited programs first (alphabetical among themselves), then the rest
// alphabetical — same ordering used for both airline and hotel pickers.
function sortedPrograms(list){
  return [...list].sort((a, b) => {
    const af = favoritePrograms.has(a), bf = favoritePrograms.has(b);
    if (af !== bf) return af ? -1 : 1;
    return a.localeCompare(b);
  });
}

// A curated <select> (airline or hotel programs) + a "Other…" fallback
// text input, plus a star toggle to favorite whichever program is picked.
// The text input (data-${prefix}-pointsprogram) is what create/update
// handlers actually read — the select just drives its value, so no
// existing read-side code needs to change. Values are populated
// separately via populatePointsProgramField() (edit forms only — new
// forms start blank, matching every other field in this app).
function pointsProgramFieldHTML(prefix, listKind){
  const list = listKind === "hotel" ? HOTEL_PROGRAMS : AIRLINE_PROGRAMS;
  const options = sortedPrograms(list).map(p =>
    `<option value="${esc(p)}">${favoritePrograms.has(p) ? "★ " : ""}${esc(p)}</option>`).join("");
  return `
    <div class="points-program-field">
      <select data-${prefix}-pointsprogram-picker data-program-list="${listKind}">
        <option value="">— None —</option>
        ${options}
        <option value="__other__">Other…</option>
      </select>
      <button type="button" class="fav-star-btn" data-${prefix}-pointsprogram-fav
          title="Favorite this program" style="display:none">☆</button>
      <input type="text" data-${prefix}-pointsprogram placeholder="Program name" style="display:none">
    </div>`;
}

function populatePointsProgramField(prefix, listKind, currentValue){
  const list = listKind === "hotel" ? HOTEL_PROGRAMS : AIRLINE_PROGRAMS;
  const picker = document.querySelector(`[data-${prefix}-pointsprogram-picker]`);
  const input = document.querySelector(`[data-${prefix}-pointsprogram]`);
  if (!picker || !input) return;
  const isCurated = currentValue && list.includes(currentValue);
  if (currentValue && !isCurated){
    picker.value = "__other__";
    input.value = currentValue;
    input.style.display = "";
  } else {
    picker.value = currentValue || "";
    input.value = currentValue || "";
    input.style.display = "none";
  }
  syncFavStar(prefix);
}

function syncFavStar(prefix){
  const picker = document.querySelector(`[data-${prefix}-pointsprogram-picker]`);
  const starBtn = document.querySelector(`[data-${prefix}-pointsprogram-fav]`);
  if (!picker || !starBtn) return;
  const v = picker.value;
  if (!v || v === "__other__"){ starBtn.style.display = "none"; return; }
  starBtn.style.display = "";
  starBtn.textContent = favoritePrograms.has(v) ? "★" : "☆";
}

function wirePointsProgramField(prefix){
  const picker = document.querySelector(`[data-${prefix}-pointsprogram-picker]`);
  const input = document.querySelector(`[data-${prefix}-pointsprogram]`);
  const starBtn = document.querySelector(`[data-${prefix}-pointsprogram-fav]`);
  if (!picker || !input) return;
  picker.addEventListener("change", () => {
    if (picker.value === "__other__"){
      input.style.display = "";
      input.value = "";
      input.focus();
    } else {
      input.style.display = "none";
      input.value = picker.value;
    }
    syncFavStar(prefix);
  });
  if (starBtn){
    starBtn.addEventListener("click", async () => {
      const v = picker.value;
      if (!v || v === "__other__") return;
      if (favoritePrograms.has(v)) await removeFavoriteProgram(v);
      else await addFavoriteProgram(v);
      const list = picker.dataset.programList === "hotel" ? HOTEL_PROGRAMS : AIRLINE_PROGRAMS;
      const options = sortedPrograms(list).map(p =>
        `<option value="${esc(p)}">${favoritePrograms.has(p) ? "★ " : ""}${esc(p)}</option>`).join("");
      picker.innerHTML = `<option value="">— None —</option>${options}<option value="__other__">Other…</option>`;
      picker.value = v;
      syncFavStar(prefix);
    });
  }
  syncFavStar(prefix);
}

// The rental form's points-program field only offers the curated hotel
// picker for kind="housing" — car rentals keep the plain free-text input
// (no car-rental program list was requested), reusing that same input
// element rather than rendering a second field.
function applyRentalKindToProgramField(prefix, kind){
  const picker = document.querySelector(`[data-${prefix}-pointsprogram-picker]`);
  const starBtn = document.querySelector(`[data-${prefix}-pointsprogram-fav]`);
  const input = document.querySelector(`[data-${prefix}-pointsprogram]`);
  if (!picker || !input) return;
  if (kind === "car"){
    picker.style.display = "none";
    if (starBtn) starBtn.style.display = "none";
    input.style.display = "";
  } else {
    picker.style.display = "";
    input.style.display = picker.value === "__other__" ? "" : "none";
    syncFavStar(prefix);
  }
}

// Shared accumulator for aggregating points across multiple flights/rentals
// by loyalty program — used anywhere points from more than one record get
// summed together (stats bar, trip total). Un-set programs bucket under "".
function addPoints(map, program, amount){
  if (!amount) return;
  const key = program || "";
  map.set(key, (map.get(key) || 0) + amount);
}
function sortedPointsEntries(map){
  return [...map.entries()].filter(([, pts]) => pts).sort((a, b) => b[1] - a[1]);
}

function paidText(f){
  const parts = [];
  if (f.paid_cash != null) parts.push(fmtCash(f.paid_cash, f.currency));
  if (f.paid_points != null) parts.push(pointsText(f.paid_points, f.points_program));
  return parts.length ? parts.join(" + ") : "—";
}

// Per-ticket price × passenger count, e.g. "$300.00 + 22,000 pts"
function flightTotalText(f){
  const n = f.passengers || 1;
  const parts = [];
  if (f.paid_cash != null) parts.push(fmtCash(f.paid_cash * n, f.currency));
  if (f.paid_points != null) parts.push(pointsText(f.paid_points * n, f.points_program));
  return parts.length ? parts.join(" + ") : "—";
}

// Outbound/return are paired lanes; standalone and round-trip flights share
// the single "solo" lane since they render in the same list.
const legScope = (leg) => (leg === "outbound" || leg === "return") ? leg : "solo";

function findFlight(flightId){
  for (const t of trips) {
    const f = (t.flights || []).find(fl => fl.id === flightId);
    if (f) return { trip: t, flight: f };
  }
  return null;
}

function findRental(rentalId){
  for (const t of trips) {
    const r = (t.rentals || []).find(x => x.id === rentalId);
    if (r) return { trip: t, rental: r };
  }
  return null;
}

// "2026-12-04" -> "Dec 4" (parsed as a plain date, no timezone shifting)
function fmtShortDate(iso){
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  if (!y || !m || !d) return iso;
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

// "22:00" -> "10:00 PM"
function fmtTime(t){
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
}

// Auto-generated flight title: "Dec 4 10:00 PM, BWI → DEN, 22,000 pts"
// (date/time, depart airport → arrival airport, points or cash paid)
// Round trip: "Dec 4 → Dec 8, BWI ⇄ DEN, 22,000 pts"
function flightTitle(origin, destination, departDate, departTime, paidCash, paidPoints, leg, returnDate){
  if (!origin || !destination) return "";
  const parts = [];
  if (leg === "roundtrip" && returnDate){
    parts.push(`${fmtShortDate(departDate)} → ${fmtShortDate(returnDate)}`);
    parts.push(`${origin.toUpperCase()} ⇄ ${destination.toUpperCase()}`);
  } else {
    const when = [fmtShortDate(departDate), fmtTime(departTime)].filter(Boolean).join(" ");
    if (when) parts.push(when);
    parts.push(`${origin.toUpperCase()} → ${destination.toUpperCase()}`);
  }
  if (paidPoints != null && paidPoints !== "" && !isNaN(paidPoints)) parts.push(fmtPoints(paidPoints));
  else if (paidCash != null && paidCash !== "" && !isNaN(paidCash)) parts.push(fmtCash(paidCash));
  return parts.join(", ");
}

// Pull airports + date out of a pasted flight-search URL where possible.
// Southwest puts them right in the query string; Kayak uses /flights/BWI-DEN/2026-12-04.
function parseFlightUrl(url){
  try {
    const u = new URL(url);
    const q = u.searchParams;
    const sw = {
      origin: q.get("originationAirportCode"),
      destination: q.get("destinationAirportCode"),
      departDate: q.get("departureDate"),
    };
    if (sw.origin && sw.destination) return sw;
    const kayak = u.pathname.match(/\/flights\/([A-Z]{3})-([A-Z]{3})\/(\d{4}-\d{2}-\d{2})/i);
    if (kayak) return { origin: kayak[1].toUpperCase(), destination: kayak[2].toUpperCase(), departDate: kayak[3] };
  } catch {}
  return null;
}

// ---------------- Date range picker ----------------
// A small calendar popover so a start/end date pair (trip dates, rental
// dates, round-trip depart/return) can be picked in two clicks on one
// calendar, instead of juggling two separate native date inputs.

function fmtISO(year, month, day){ // month is 0-indexed
  return `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

function parseISODate(iso){
  if (!iso) return null;
  const [y,m,d] = iso.split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m-1, d);
}

let activeDateRangePopover = null;
let dateRangeDocListener = null;

function closeDateRangePopover(){
  if (activeDateRangePopover){ activeDateRangePopover.remove(); activeDateRangePopover = null; }
  if (dateRangeDocListener){ document.removeEventListener("click", dateRangeDocListener, true); dateRangeDocListener = null; }
}

function renderCalMonth(year, month, rangeStart, rangeEnd){
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<span class="cal-day cal-empty"></span>`;
  for (let d = 1; d <= daysInMonth; d++){
    const cur = new Date(year, month, d);
    let cls = "cal-day";
    if (rangeStart && cur.getTime() === rangeStart.getTime()) cls += " range-start";
    if (rangeEnd && cur.getTime() === rangeEnd.getTime()) cls += " range-end";
    if (rangeStart && rangeEnd && cur > rangeStart && cur < rangeEnd) cls += " in-range";
    cells += `<button type="button" class="${cls}" data-cal-day="${fmtISO(year, month, d)}">${d}</button>`;
  }
  return `
    <div class="cal-nav">
      <button type="button" class="btn-link" data-cal-prev>‹</button>
      <span>${monthLabel}</span>
      <button type="button" class="btn-link" data-cal-next>›</button>
    </div>
    <div class="cal-grid cal-dow">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-actions"><button type="button" class="btn-link" data-cal-clear>clear</button></div>`;
}

function openDateRangePicker(anchorBtn, startInput, endInput){
  closeDateRangePopover();
  let rangeStart = parseISODate(startInput.value);
  let rangeEnd = parseISODate(endInput.value);
  const initial = rangeStart || new Date();
  let viewYear = initial.getFullYear(), viewMonth = initial.getMonth();

  const pop = document.createElement("div");
  pop.className = "daterange-popover";
  document.body.appendChild(pop);
  activeDateRangePopover = pop;

  const position = () => {
    const r = anchorBtn.getBoundingClientRect();
    pop.style.top = `${r.bottom + window.scrollY + 4}px`;
    pop.style.left = `${r.left + window.scrollX}px`;
  };

  const setValues = () => {
    startInput.value = rangeStart ? fmtISO(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate()) : "";
    endInput.value = rangeEnd ? fmtISO(rangeEnd.getFullYear(), rangeEnd.getMonth(), rangeEnd.getDate()) : "";
    startInput.dispatchEvent(new Event("input", { bubbles: true }));
    endInput.dispatchEvent(new Event("input", { bubbles: true }));
  };

  const redraw = () => {
    pop.innerHTML = renderCalMonth(viewYear, viewMonth, rangeStart, rangeEnd);
    position();
    pop.querySelector("[data-cal-prev]").addEventListener("click", () => {
      viewMonth--; if (viewMonth < 0){ viewMonth = 11; viewYear--; }
      redraw();
    });
    pop.querySelector("[data-cal-next]").addEventListener("click", () => {
      viewMonth++; if (viewMonth > 11){ viewMonth = 0; viewYear++; }
      redraw();
    });
    pop.querySelector("[data-cal-clear]").addEventListener("click", () => {
      rangeStart = null; rangeEnd = null;
      setValues();
      redraw();
    });
    pop.querySelectorAll("[data-cal-day]").forEach(cell => {
      cell.addEventListener("click", () => {
        const clicked = parseISODate(cell.dataset.calDay);
        if (!rangeStart || rangeEnd){
          rangeStart = clicked; rangeEnd = null;
        } else if (clicked < rangeStart){
          rangeEnd = rangeStart; rangeStart = clicked;
        } else {
          rangeEnd = clicked;
        }
        setValues();
        if (rangeStart && rangeEnd){ closeDateRangePopover(); return; }
        redraw();
      });
    });
  };
  redraw();

  dateRangeDocListener = (e) => {
    if (!pop.contains(e.target) && e.target !== anchorBtn) closeDateRangePopover();
  };
  setTimeout(() => document.addEventListener("click", dateRangeDocListener, true), 0);
}

function wireDateRangeButtons(){
  document.querySelectorAll("[data-dr-btn]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const container = btn.closest(
        "[data-edit-form], [data-add-flight-form], [data-rental-edit-form], [data-add-rental-form], [data-meta-edit]"
      ) || btn.parentElement;
      const startInput = container.querySelector(btn.dataset.drStart);
      const endInput = container.querySelector(btn.dataset.drEnd);
      if (!startInput || !endInput) return;
      openDateRangePicker(btn, startInput, endInput);
    });
  });
}

// ---------------- Screenshot OCR (client-side, best-effort) ----------------

let tesseractLoadPromise = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (!tesseractLoadPromise){
    tesseractLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = () => resolve(window.Tesseract);
      s.onerror = () => reject(new Error("Couldn't load the OCR library (offline?)."));
      document.head.appendChild(s);
    });
  }
  return tesseractLoadPromise;
}

async function runOcr(file, onProgress){
  const Tesseract = await loadTesseract();
  const { data } = await Tesseract.recognize(file, "eng", {
    logger: onProgress ? (m) => onProgress(m) : undefined
  });
  return data.text || "";
}

const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];

// Best-effort text -> {date, time, flightNumber, confirmationCode}. Every
// field can be wrong or missing — this only suggests values for the user
// to review, it never saves anything on its own.
function parseScreenshotText(text){
  const out = { date: null, time: null, flightNumber: null, confirmationCode: null };
  if (!text) return out;

  let m = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if (m) out.date = `${m[1]}-${m[2]}-${m[3]}`;
  if (!out.date){
    m = text.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
    if (m){
      let [, mm, dd, yy] = m;
      if (yy.length === 2) yy = "20" + yy;
      out.date = `${yy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
    }
  }
  if (!out.date){
    m = text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/i);
    if (m){
      const mi = MONTHS.indexOf(m[1].toLowerCase());
      const year = m[3] || new Date().getFullYear();
      out.date = `${year}-${String(mi+1).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
    }
  }

  m = text.match(/\b(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)\b/);
  if (m){
    let h = parseInt(m[1], 10);
    const ampm = m[3].toLowerCase();
    if (ampm === "pm" && h !== 12) h += 12;
    if (ampm === "am" && h === 12) h = 0;
    out.time = `${String(h).padStart(2,"0")}:${m[2]}`;
  }

  m = text.match(/\bflight\s*#?\s*[:\-]?\s*([A-Z]{1,3}\s?\d{2,4})\b/i)
    || text.match(/\b([A-Z]{2})\s?(\d{2,4})\b/);
  if (m) out.flightNumber = (m[1] + (m[2] || "")).replace(/\s+/g, "").toUpperCase();

  m = text.match(/\b(?:confirmation|conf(?:irmation)?\.?|record locator|booking)\s*(?:code|#|no\.?)?\s*[:\-]?\s*([A-Z0-9]{5,8})\b/i);
  if (m) out.confirmationCode = m[1].toUpperCase();

  return out;
}

// ---------------- Auth screen ----------------

function renderAuth(){
  document.getElementById("loggedOutBrand").style.display = "";
  document.getElementById("sidebar").innerHTML = "";
  document.getElementById("subtext").textContent = "Sign in to see your flights.";
  let body;
  if (authMode === "reset"){
    body = `
      <h2>Set a new password</h2>
      <label>New password</label>
      <input type="password" id="a-newpass">
      <div class="row" style="margin-top:14px">
        <button class="btn" id="a-submit">Update password</button>
      </div>`;
  } else if (authMode === "forgot"){
    body = `
      <h2>Reset password</h2>
      <label>Email</label>
      <input type="email" id="a-email">
      <div class="row" style="margin-top:14px">
        <button class="btn" id="a-submit">Send reset link</button>
      </div>
      <p class="auth-switch"><button id="a-back">Back to log in</button></p>`;
  } else {
    const isSignup = authMode === "signup";
    body = `
      <h2>${isSignup ? "Create account" : "Log in"}</h2>
      <label>Email</label>
      <input type="email" id="a-email">
      <label>Password</label>
      <input type="password" id="a-pass">
      <div class="row" style="margin-top:14px">
        <button class="btn" id="a-submit">${isSignup ? "Sign up" : "Log in"}</button>
      </div>
      <p class="auth-switch">
        ${isSignup ? "Already have an account?" : "Need an account?"}
        <button id="a-toggle">${isSignup ? "Log in" : "Sign up"}</button>
      </p>
      ${!isSignup ? `<p class="auth-switch"><button id="a-forgot">Forgot password?</button></p>` : ""}`;
  }

  root.innerHTML = `
    <div class="auth-wrap">
      ${body}
      ${authError ? `<p class="err">${esc(authError)}</p>` : ""}
      ${authMsg ? `<p class="msg">${esc(authMsg)}</p>` : ""}
    </div>`;

  const emailEl = document.getElementById("a-email");
  const passEl = document.getElementById("a-pass");
  const submitBtn = document.getElementById("a-submit");
  const toggleBtn = document.getElementById("a-toggle");
  const forgotBtn = document.getElementById("a-forgot");
  const backBtn = document.getElementById("a-back");

  if (toggleBtn) toggleBtn.addEventListener("click", () => {
    authMode = authMode === "signup" ? "login" : "signup";
    authError = ""; authMsg = "";
    renderAuth();
  });
  if (forgotBtn) forgotBtn.addEventListener("click", () => {
    authMode = "forgot"; authError = ""; authMsg = "";
    renderAuth();
  });
  if (backBtn) backBtn.addEventListener("click", () => {
    authMode = "login"; authError = ""; authMsg = "";
    renderAuth();
  });

  submitBtn.addEventListener("click", async () => {
    authError = ""; authMsg = "";
    try {
      if (authMode === "signup"){
        const { error } = await supabase.auth.signUp({
          email: emailEl.value.trim(), password: passEl.value,
          options: { emailRedirectTo: window.location.href }
        });
        if (error) throw error;
        authMsg = "Check your email to confirm your account, then log in.";
        authMode = "login";
      } else if (authMode === "login"){
        const { error } = await supabase.auth.signInWithPassword({
          email: emailEl.value.trim(), password: passEl.value
        });
        if (error) throw error;
      } else if (authMode === "forgot"){
        const { error } = await supabase.auth.resetPasswordForEmail(emailEl.value.trim(), {
          redirectTo: window.location.href
        });
        if (error) throw error;
        authMsg = "Check your email for a reset link.";
      } else if (authMode === "reset"){
        const newPassEl = document.getElementById("a-newpass");
        const { error } = await supabase.auth.updateUser({ password: newPassEl.value });
        if (error) throw error;
        authMsg = "Password updated. You're logged in.";
        authMode = "login";
      }
    } catch (e){
      authError = e.message || String(e);
    }
    renderAuth();
  });
}

    .from("trips")

    .order("created_at", { ascending: true });
  if (error) { console.error(error); return []; }
  for (const t of data){

// ---------------- Attachments (screenshots) ----------------

function findAttachmentOwner(attId){
  for (const t of trips){
    for (const f of (t.flights || [])){
      const a = (f.attachments || []).find(x => x.id === attId);
      if (a) return { trip: t, item: f, kind: "flight", attachment: a };
    }
    for (const r of (t.rentals || [])){
      const a = (r.attachments || []).find(x => x.id === attId);
      if (a) return { trip: t, item: r, kind: "rental", attachment: a };
    }
  }
  return null;
}

async function uploadAttachment(tripId, kind, itemId, file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const path = `${tripId}/${uid()}.${ext}`;
  const { error: upErr } = await supabase.storage.from("attachments").upload(path, file);
  if (upErr) { alert(upErr.message); return null; }
  const { data, error } = await supabase.from("attachments").insert({
    trip_id: tripId,
    flight_id: kind === "flight" ? itemId : null,
    rental_id: kind === "rental" ? itemId : null,
    storage_path: path, filename: file.name
  }).select().single();
  if (error) { alert(error.message); return null; }
  return data;
}

async function deleteAttachment(att){
  await supabase.storage.from("attachments").remove([att.storage_path]);
  const { error } = await supabase.from("attachments").delete().eq("id", att.id);
  if (error) alert(error.message);
}

async function attachmentSignedUrl(path){
  const { data, error } = await supabase.storage.from("attachments").createSignedUrl(path, 3600);
  if (error) { console.error(error); return null; }
  return data.signedUrl;
}

async function saveAttachmentOcrText(id, text){

}

async function moveFlightToTrip(flightId, newTripId){
  const siblingPositions = (trips.find(t => t.id === newTripId)?.flights || []).map(f => f.position);
  const position = siblingPositions.length ? Math.max(...siblingPositions) + 1000 : 0;
  const { error } = await supabase.from("flights").update({ trip_id: newTripId, leg: null, position }).eq("id", flightId);
  if (error) alert(error.message);
}

// Mirrors moveFlightToTrip: append to the destination's positions. Rentals
// have no leg to clear, so kind and status carry over unchanged.
async function moveRentalToTrip(rentalId, newTripId){
  const siblingPositions = (trips.find(t => t.id === newTripId)?.rentals || []).map(r => r.position);
  const position = siblingPositions.length ? Math.max(...siblingPositions) + 1000 : 0;
  const { error } = await supabase.from("rentals").update({ trip_id: newTripId, position }).eq("id", rentalId);
  if (error) alert(error.message);
}

async function reorderItem(table, item, siblings, targetIndex){
  // siblings: array of rows (excluding `item`) in the same list, sorted by position
  let before = siblings[targetIndex - 1];
  let after = siblings[targetIndex];
  let newPos;
  if (!before && !after) newPos = 0;
  else if (!before) newPos = after.position - 1000;
  else if (!after) newPos = before.position + 1000;
  else {
    newPos = (before.position + after.position) / 2;
    if (after.position - before.position < 1e-6){
      // renumber this list, then bail (positions are now clean)
      const all = [...siblings];
      all.splice(targetIndex, 0, item);
      for (let i = 0; i < all.length; i++){
        await supabase.from(table).update({ position: i * 1000 }).eq("id", all[i].id);
      }
      return;
    }
  }
  const { error } = await supabase.from(table).update({ position: newPos }).eq("id", item.id);
  if (error) alert(error.message);
}

// Bulk-create trips (with nested flights/price_logs) from a plain JS array
// shaped like `trips` rows with `.flights[].price_logs[]` attached. Used by
// both the one-time localStorage migration and JSON "Import" (new trips).
async function bulkCreateTrips(tripBlobs){
  const tripRows = [], flightRows = [], logRows = [], rentalRows = [];
  for (const t of tripBlobs){
    const tripId = uid();
    tripRows.push({
      id: tripId, owner_id: session.user.id, title: t.title || "Imported trip",
      travel_start: t.travel_start || null, travel_end: t.travel_end || null,
      notes: t.notes || null, attendees: t.attendees || []
    });
    const byLeg = {};
    for (const f of (t.flights || [])){
      const legKey = f.leg || "_";
      byLeg[legKey] = (byLeg[legKey] || 0);
      const flightId = uid();
      flightRows.push({
        id: flightId, trip_id: tripId, label: f.label, leg: f.leg || null,
        url: f.url, currency: f.currency || "USD",
        origin: f.origin || null, destination: f.destination || null,
        depart_date: f.depart_date || null, depart_time: f.depart_time || null,
        return_date: f.return_date || null, return_time: f.return_time || null,
        paid_cash: f.paidCash ?? f.paid_cash ?? null,
        paid_points: f.paidPoints ?? f.paid_points ?? null,
        points_program: f.pointsProgram ?? f.points_program ?? null,
        passengers: f.passengers || 1,
        alert_below: f.alertBelow ?? f.alert_below ?? null,
        notes: f.notes || null, position: byLeg[legKey]
      });
      byLeg[legKey] += 1000;
      for (const l of (f.priceLog || f.price_logs || [])){
        logRows.push({ id: uid(), flight_id: flightId, date: l.date, price: l.price });
      }
    }
    let rentalPos = 0;
    for (const r of (t.rentals || [])){
      rentalRows.push({
        id: uid(), trip_id: tripId, kind: r.kind || "housing", label: r.label,
        url: r.url || null, currency: r.currency || "USD",
        paid_cash: r.paidCash ?? r.paid_cash ?? null,
        paid_points: r.paidPoints ?? r.paid_points ?? null,
        points_program: r.pointsProgram ?? r.points_program ?? null,
        rental_start: r.rental_start || null, rental_end: r.rental_end || null,
        cancel_by: r.cancel_by || null, confirmation_code: r.confirmation_code || null,
        splits: r.splits || [], notes: r.notes || null, position: rentalPos
      });
      rentalPos += 1000;
    }
  }
  if (tripRows.length){ const { error } = await supabase.from("trips").insert(tripRows); if (error) throw error; }
  if (flightRows.length){ const { error } = await supabase.from("flights").insert(flightRows); if (error) throw error; }
  if (logRows.length){ const { error } = await supabase.from("price_logs").insert(logRows); if (error) throw error; }
  if (rentalRows.length){ const { error } = await supabase.from("rentals").insert(rentalRows); if (error) throw error; }
}

function exportAllTrips(){
  const blob = new Blob([JSON.stringify({ groups: trips.map(t => ({
    title: t.title, travel_start: t.travel_start, travel_end: t.travel_end,
    notes: t.notes, attendees: t.attendees,
    flights: (t.flights||[]).map(f => ({
      label: f.label, leg: f.leg, url: f.url, currency: f.currency,
      origin: f.origin, destination: f.destination,
      depart_date: f.depart_date, depart_time: f.depart_time,
      return_date: f.return_date, return_time: f.return_time,
      paidCash: f.paid_cash, paidPoints: f.paid_points, pointsProgram: f.points_program, passengers: f.passengers,
      alertBelow: f.alert_below,
      notes: f.notes, priceLog: (f.price_logs||[]).map(l => ({date: l.date, price: l.price}))
    })),
    rentals: (t.rentals||[]).map(r => ({
      kind: r.kind, label: r.label, url: r.url, currency: r.currency,
      paidCash: r.paid_cash, paidPoints: r.paid_points, pointsProgram: r.points_program,
      rental_start: r.rental_start, rental_end: r.rental_end,
      cancel_by: r.cancel_by, confirmation_code: r.confirmation_code,
      splits: r.splits, notes: r.notes
    }))
  })) }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `flight-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}

async function importFromLocalStorage(){
  let raw;
  try { raw = JSON.parse(localStorage.getItem(OLD_LOCAL_KEY)); } catch { raw = null; }
  if (!raw || !Array.isArray(raw.groups) || !raw.groups.length){
    alert("No saved browser data found to import.");
    return;
  }
  const tripBlobs = raw.groups.map(g => ({ title: g.title, flights: g.flights || [] }));
  try {
    await bulkCreateTrips(tripBlobs);
    localStorage.setItem(MIGRATED_FLAG, "true");
    await refresh();
  } catch (e){
    alert("Import failed (nothing was marked as migrated, so it's safe to retry): " + e.message);
  }
}

// Small camera trigger for the card's title row — same data-att-picker
// encoding wireAttachments() already delegates on, just relocated so a
// card with zero screenshots doesn't reserve a whole row for it.
// The whole attachment affordance, sized to sit inline in a card's title
// row: existing screenshot thumbnails followed by the add button, so a card
// never spends a separate row on screenshots. Delete / view-text controls
// appear on hover to keep the resting header uncluttered. The data-att-*
// attributes are unchanged, so wireAttachments() needs no changes.
function attachmentHeader(kind, itemId, attachments){
  const thumbs = (attachments || []).map(att => `
    <span class="att-chip" data-att-id="${att.id}">
      <img data-att-img="${att.id}" data-att-path="${esc(att.storage_path)}"
        data-att-open="${att.id}" alt="screenshot" title="Click to view full size">
      <button class="att-del" data-att-del="${att.id}" title="Delete">×</button>
      <button class="att-text-btn" data-att-view-text="${att.id}" title="View extracted text">📄</button>
    </span>`).join("");
  return `
    <span class="att-cluster">
      ${thumbs}
      <span class="att-icon-btn" tabindex="0" data-att-picker="${kind}:${itemId}"
          title="Click here, then paste a copied image (⌘V/Ctrl+V) — click again to browse files instead">📷</span>
      <input type="file" accept="image/*" data-att-upload="${kind}:${itemId}" hidden>
    </span>`;
}

// Appends a "#farelog=<flightId>" fragment to a flight's booking URL so the
// price-logging bookmarklet (see renderBookmarkletPanel) knows which flight
// to log against. Fragments are never sent to the server, so this is inert
// to the airline site — skipped if the URL already has one, to be safe.
function checkPriceUrl(f){
  if (!f.url || f.url.includes("#")) return f.url;
  return `${f.url}#farelog=${f.id}`;
}

// Inline SVG sparkline of logged prices over time, x-scaled to the actual
// dates entered (not just entry index) so a cluster of same-week checks
// reads differently from checks spread over months. Needs 2+ entries to
// draw a trend; a single data point has nothing to trend against.
function renderPriceTrendChart(entries, paidRef, cur, isPoints){
  if (entries.length < 2) return "";
  const fmt = v => isPoints ? fmtPoints(v) : fmtCash(v, cur);
  const toTs = e => { const [y,m,d] = e.date.split("-").map(Number); return new Date(y, m-1, d).getTime(); };
  const sorted = [...entries].sort((a,b) => toTs(a) - toTs(b));
  const first = sorted[0], last = sorted[sorted.length - 1];

  const W = 300, H = 60, padX = 6, padTop = 8, padBottom = 16;
  const xMin = toTs(first), xMax = toTs(last);
  const prices = sorted.map(e => e.price);
  let yMin = Math.min(...prices), yMax = Math.max(...prices);
  if (paidRef != null){ yMin = Math.min(yMin, paidRef); yMax = Math.max(yMax, paidRef); }
  if (yMin === yMax){ yMin -= 1; yMax += 1; } // flat line — pad so it's not degenerate

  const xAt = (e, i) => padX + (xMax > xMin
    ? (toTs(e) - xMin) / (xMax - xMin)
    : (sorted.length > 1 ? i / (sorted.length - 1) : 0)) * (W - padX * 2);
  const yAt = price => padTop + (1 - (price - yMin) / (yMax - yMin)) * (H - padTop - padBottom);

  const pts = sorted.map((e, i) => ({ x: xAt(e, i), y: yAt(e.price) }));
  const polyPoints = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const circles = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" class="price-trend-dot"/>`).join("");
  const paidLine = paidRef != null
    ? `<line x1="${padX}" y1="${yAt(paidRef).toFixed(1)}" x2="${W-padX}" y2="${yAt(paidRef).toFixed(1)}" class="price-trend-paid-line"/>`
    : "";

  const delta = last.price - first.price;
  const deltaCls = delta === 0 ? "flat" : (delta < 0 ? "down" : "up");
  const deltaTxt = delta === 0 ? "flat" : `${delta < 0 ? "▼" : "▲"} ${fmt(Math.abs(delta))}`;

  // The SVG is stretched (preserveAspectRatio="none"), so text inside it
  // would be distorted — the min/max labels are HTML in a left gutter
  // instead, positioned at the same percentages the plot band uses so they
  // line up exactly with the top and bottom of the drawn range.
  const topPct = (yAt(yMax) / H) * 100;
  const botPct = (yAt(yMin) / H) * 100;

  return `
    <div class="price-trend">
      <div class="price-trend-head">
        <span class="price-trend-label">Price trend</span>
        <span class="${deltaCls}">${deltaTxt} since ${fmtShortDate(first.date)}</span>
      </div>
      <div class="price-trend-plot">
        <div class="price-trend-yaxis">
          <span style="top:${topPct.toFixed(2)}%">${fmt(yMax)}</span>
          <span style="top:${botPct.toFixed(2)}%">${fmt(yMin)}</span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="price-trend-svg">
          ${paidLine}
          <polyline points="${polyPoints}" class="price-trend-line"/>
          ${circles}
        </svg>
      </div>
      <div class="price-trend-axis"><span>${fmtShortDate(first.date)}</span><span>${fmtShortDate(last.date)}</span></div>
    </div>`;
}

function renderCard(trip, f){
  const cur = f.currency || "USD";
  // An award booking's price checks are almost always quoted in points too,
  // so default the log-price unit to match how the seat was actually bought.
  const paidInPoints = f.paid_points != null && f.paid_cash == null;
  const moveOptions = trips.filter(t => t.id !== trip.id)
    .map(t => `<option value="${t.id}">${esc(t.title)}</option>`).join("");
  const passengers = f.passengers || 1;
  const metaBits = [passengers > 1
    ? `Paid <b>${paidText(f)}</b> × ${passengers} = <b>${flightTotalText(f)}</b>`
    : `Paid <b>${paidText(f)}</b>`];
  if (f.leg === "roundtrip" && f.return_date){
    const ret = [fmtShortDate(f.return_date), fmtTime(f.return_time)].filter(Boolean).join(" ");
    metaBits.push(`Return <b>${esc(ret)}</b>`);
  }
  if (f.flight_number) metaBits.push(`Flight <b>${esc(f.flight_number)}</b>`);
  if (f.confirmation_code) metaBits.push(`Conf. <b>${esc(f.confirmation_code)}</b>`);
  if (f.alert_below != null) metaBits.push(`Alert below <b>${fmtCash(f.alert_below, cur)}</b>`);

  const entries = f.price_logs || [];
  let histHTML;
  if (!entries.length){
    histHTML = `<p class="empty-hist">No checks logged yet.</p>`;
  } else {
    // All entries render; the ones past the newest 3 are hidden by CSS until
    // the caret below expands them (entries are already newest-first).
    const rows = entries.map((e) => {
      let deltaHTML = '<span class="flat">·</span>';
      const paidRef = e.is_points ? f.paid_points : f.paid_cash;
      if (paidRef != null){
        const d = e.price - paidRef;
        const dTxt = e.is_points ? fmtPoints(Math.abs(d)) : fmtCash(Math.abs(d), cur);
        deltaHTML = d === 0 ? '<span class="flat">even</span>' :
          `<span class="${d<0?'down':'up'}">${d<0?'▼':'▲'} ${dTxt}</span>`;
      }
      let statusTxt = "", statusCls = "";
      if (!e.is_points && f.alert_below != null && e.price <= f.alert_below){ statusTxt = "BELOW ALERT"; statusCls = "status-alert"; }
      return `<tr data-log-row="${e.id}">
        <td title="${esc(e.date)}">${fmtShortDate(e.date)}</td>
        <td>${e.is_points ? fmtPoints(e.price) : fmtCash(e.price, cur)}</td>
        <td>${deltaHTML}</td>
        <td>${statusTxt ? `<span class="status ${statusCls}">${statusTxt}</span>` : ""}</td>
        <td>
          <span class="btn-link" data-edit-log="${e.id}" data-flight="${f.id}">edit</span>
          <span class="btn-link" data-del-log="${e.id}">remove</span>
        </td>
      </tr>`;
    }).join("");
    // A single sparkline can't mix cash and points on one y-axis (different
    // units, wildly different scales), so it plots one series: the unit this
    // flight was bought in when that has enough points to draw, else whichever
    // unit has been logged more.
    const cashOnly = entries.filter(e => !e.is_points);
    const pointsOnly = entries.filter(e => e.is_points);
    const preferred = paidInPoints ? pointsOnly : cashOnly;
    const fallback = paidInPoints ? cashOnly : pointsOnly;
    const chartIsPoints = preferred.length >= 2
      ? paidInPoints
      : (fallback.length >= 2 ? !paidInPoints : paidInPoints);
    const chartEntries = preferred.length >= 2 ? preferred : fallback;
    const chartPaidRef = chartIsPoints ? f.paid_points : f.paid_cash;
    const extra = entries.length - 3;
    histHTML = `
      ${renderPriceTrendChart(chartEntries, chartPaidRef, cur, chartIsPoints)}
      <div class="hist-wrap">
        <table class="hist${extra > 0 ? " hist-collapsed" : ""}" data-hist="${f.id}">
          <tr><th>Date</th><th>Price seen</th><th>vs. paid</th><th></th><th></th></tr>
          ${rows}
        </table>
      </div>
      ${extra > 0 ? `<button type="button" class="hist-toggle" data-hist-toggle="${f.id}" data-extra="${extra}">
        <span class="hist-caret">▾</span><span class="hist-toggle-label">Show ${extra} earlier check${extra > 1 ? "s" : ""}</span>
      </button>` : ""}`;
  }

  return `
  <div class="card${f.status === "watching" ? " card-watching" : " card-booked"}" data-card="${f.id}" data-leg="${legScope(f.leg)}" data-trip="${trip.id}">
    <div class="card-title-row">
      <span class="drag-handle" draggable="true" data-drag-handle="${f.id}" title="Drag to reorder">⠿</span>
      <h3>${esc(f.label)}</h3>
      ${f.status === "watching" ? `<span class="watch-badge">👁 Watching</span>` : ""}
      ${attachmentHeader("flight", f.id, f.attachments)}
    </div>
    <p class="meta-line">${metaBits.join(" &middot; ")}</p>
    ${f.notes ? `<p class="notes">${esc(f.notes)}</p>` : ""}
    ${attachmentHolders(f.id)}
    <div class="row">
      ${f.url ? `<a class="btn btn-sm" href="${esc(checkPriceUrl(f))}" target="_blank" rel="noopener">Check price →</a>` : ""}
      <details class="menu card-menu">
        <summary class="btn btn-ghost btn-sm" title="More actions">⋯</summary>
        <div class="menu-panel">
          <button type="button" data-edit-flight="${f.id}">Edit</button>
          <button type="button" data-toggle-flight-status="${f.id}" data-next-status="${f.status === "watching" ? "booked" : "watching"}">
            ${f.status === "watching" ? "Mark booked" : "Mark watching"}</button>
          ${moveOptions ? `<div class="menu-divider"></div>
            <label class="menu-label">Move to trip
              <select data-move-flight="${f.id}">
                <option value="">Choose trip…</option>
                ${moveOptions}
              </select>
            </label>` : ""}
          <div class="menu-divider"></div>
          <button type="button" class="menu-danger" data-del-flight="${f.id}">Delete flight</button>
        </div>
      </details>
    </div>
    <div class="log-form">
      <input type="number" step="0.01" placeholder="Price seen" data-log-input="${f.id}">
      <select class="unit-select" data-log-unit="${f.id}">
        <option value="cash" ${paidInPoints ? "" : "selected"}>$</option>
        <option value="points" ${paidInPoints ? "selected" : ""}>pts</option>
      </select>
      <button class="btn btn-ghost btn-sm" data-save-log="${f.id}">Log price</button>
    </div>
    ${histHTML}
  </div>`;
}

function renderTripPanel(trip){
  const flights = trip.flights || [];
  const bookedFlights = flights.filter(f => f.status !== "watching");
  const watchingFlights = flights.filter(f => f.status === "watching");
  const out = bookedFlights.filter(f => f.leg === "outbound");
  const ret = bookedFlights.filter(f => f.leg === "return");
  const solo = bookedFlights.filter(f => !f.leg || f.leg === "roundtrip");

  let pairsHTML = "";
  const pairCount = Math.max(out.length, ret.length);
  for (let i = 0; i < pairCount; i++){
    pairsHTML += `<div class="pair-row">
      <div class="leg-col drop-zone" data-leg-list="outbound" data-trip="${trip.id}"
        data-drop-kind="flight" data-drop-status="booked" data-drop-leg="outbound">
        ${out[i] ? `<div class="leg-tag">Outbound</div>${renderCard(trip, out[i])}` : ""}
      </div>
      <div class="leg-col drop-zone" data-leg-list="return" data-trip="${trip.id}"
        data-drop-kind="flight" data-drop-status="booked" data-drop-leg="return">
        ${ret[i] ? `<div class="leg-tag">Return</div>${renderCard(trip, ret[i])}` : ""}
      </div>
    </div>`;
  }
  const soloHTML = `<div class="solo-list drop-zone" data-leg-list="solo" data-trip="${trip.id}"
    data-drop-kind="flight" data-drop-status="booked" data-drop-leg="solo">
    ${solo.map(f => renderCard(trip, f)).join("")}
  </div>`;

  const rentals = trip.rentals || [];
  const bookedRentals = rentals.filter(r => r.status !== "watching");
  const watchingRentals = rentals.filter(r => r.status === "watching");

  const totalCash = bookedFlights.reduce((s,f) => s + (f.paid_cash || 0) * (f.passengers || 1), 0)
    + bookedRentals.reduce((s,r) => s + (rentalOurPortion(r) || 0), 0);
  const totalPointsByProgram = new Map();
  for (const f of bookedFlights) addPoints(totalPointsByProgram, f.points_program, (f.paid_points || 0) * (f.passengers || 1));
  for (const r of bookedRentals) addPoints(totalPointsByProgram, r.points_program, r.paid_points || 0);
  const totalParts = [];
  if (totalCash) totalParts.push(fmtCash(totalCash));
  for (const [program, pts] of sortedPointsEntries(totalPointsByProgram)) totalParts.push(pointsText(pts, program));

  const bookedHousing = bookedRentals.filter(r => r.kind !== "car");
  const bookedCars = bookedRentals.filter(r => r.kind === "car");
  const hasBookedFlight = bookedFlights.length > 0;
  const housingWarn = hasBookedFlight && bookedHousing.length === 0;
  const carsWarn = hasBookedFlight && bookedCars.length === 0;

  const watchingHousing = watchingRentals.filter(r => r.kind !== "car");
  const watchingCars = watchingRentals.filter(r => r.kind === "car");
  const hasWatching = watchingFlights.length > 0 || watchingRentals.length > 0;
  // twoCol: flights get two cards per row to match the booked lane. Watching
  // flights are competing options rather than an outbound/return pair, so
  // they just flow through the grid instead of being paired by index.
  // The zone wrapper is unconditional (not just for the two-column flights
  // lane) so every watching lane is a drop target, including an empty one —
  // that's how a card gets dragged into a section that has nothing in it yet.
  const watchingLane = (label, items, kind, renderFn, twoCol, laneAttrs) => {
    const cards = items.map(item => withPlanCheckbox(trip, kind, item.id, renderFn(trip, item))).join("");

         ${watchingLane(`${ICON_FLIGHT} Flights`, watchingFlights, "flight", renderCard, true,

         <div class="lane-grid">

  const isOwner = trip.owner_id === session.user.id;

        <button class="btn btn-sm" data-add-flight-toggle="${trip.id}">+ Add flight</button>

        <details class="menu search-trip-menu">

      </div>

      ${totalParts.length ? `<div class="totals">Total paid: ${totalParts.join(" + ")}</div>` : ""}

      ${metaParts.length ? `<div class="meta-block">${metaParts.join("")}</div>` : ""}
      <div data-meta-form="${trip.id}"></div>

      <div class="share-block">
        <div class="collab-list">

        </div>
        ${isOwner ? `<div class="row" style="margin-top:6px">

      </div>

      <div data-add-flight-form="${trip.id}"></div>

      <div class="lane-stack">

        </div>
        <div class="lane-grid">
          <div class="lane${housingWarn ? " lane-warn" : ""}">

            ${!bookedCars.length ? `<p class="empty-hist">No car booked yet.</p>` : ""}

        </div>

      ${watchingHTML}

// Shared auto-title behavior for the add/edit flight forms. `sel` maps logical
// names to the form's data-attribute selectors.
function wireAutoTitle(container, sel){
  const urlEl = container.querySelector(sel.url);
  const originEl = container.querySelector(sel.origin);
  const destEl = container.querySelector(sel.dest);
  const dateEl = container.querySelector(sel.date);
  const timeEl = container.querySelector(sel.time);
  const cashEl = container.querySelector(sel.paidCash);
  const pointsEl = container.querySelector(sel.paidPoints);
  const labelEl = container.querySelector(sel.label);
  const legEl = sel.leg ? container.querySelector(sel.leg) : null;
  const returnDateEl = sel.returnDate ? container.querySelector(sel.returnDate) : null;
  const returnWrap = sel.returnWrap ? container.querySelector(sel.returnWrap) : null;

  const regen = () => {
    if (labelEl.dataset.auto === "0") return;
    const t = flightTitle(originEl.value.trim(), destEl.value.trim(),
      dateEl.value, timeEl.value,
      cashEl.value === "" ? null : parseFloat(cashEl.value),
      pointsEl.value === "" ? null : parseFloat(pointsEl.value),
      legEl ? legEl.value : null, returnDateEl ? returnDateEl.value : null);
    if (t) labelEl.value = t;
  };
  const syncReturnVisibility = () => {
    if (!returnWrap || !legEl) return;
    returnWrap.style.display = legEl.value === "roundtrip" ? "contents" : "none";
  };
  labelEl.addEventListener("input", () => { labelEl.dataset.auto = "0"; });
  [originEl, destEl, dateEl, timeEl, cashEl, pointsEl].forEach(el => el.addEventListener("input", regen));
  if (returnDateEl) returnDateEl.addEventListener("input", regen);
  if (legEl) legEl.addEventListener("change", () => { syncReturnVisibility(); regen(); });
  syncReturnVisibility();
  urlEl.addEventListener("input", () => {
    const parsed = parseFlightUrl(urlEl.value.trim());
    if (!parsed) return;
    if (parsed.origin) originEl.value = parsed.origin;
    if (parsed.destination) destEl.value = parsed.destination;
    if (parsed.departDate) dateEl.value = parsed.departDate;
    regen();
  });
}

function rentalCancelBadge(r){
  if (!r.cancel_by) return "";
  const today = new Date(); today.setHours(0,0,0,0);
  const [y,m,d] = r.cancel_by.split("-").map(Number);
  const cancelDate = new Date(y, m-1, d);
  const daysLeft = Math.round((cancelDate - today) / 86400000);
  let cls = "", txt = `Cancel by ${fmtShortDate(r.cancel_by)}`;
  if (daysLeft < 0){ txt = `Cancel window passed (${fmtShortDate(r.cancel_by)})`; }
  else if (daysLeft === 0){ txt = "LAST DAY to cancel"; cls = "status-warn"; }
  else if (daysLeft <= 7){ txt = `Cancel by ${fmtShortDate(r.cancel_by)} — ${daysLeft}d left`; cls = "status-warn"; }
  return `<span class="status ${cls}">${txt}</span>${r.reminded_at ? ` <span class="status">reminder sent</span>` : ""}`;
}

const SPLIT_SLOTS = 5;

// A split entry gives either a percent of paid_cash or a flat amount —
// whichever the user filled in. These derive the other value for display.
function splitDollar(entry, total){
  if (entry.amount != null) return entry.amount;
  if (entry.percent != null && total != null) return total * entry.percent / 100;
  return null;
}
function splitPercent(entry, total){
  if (entry.percent != null) return entry.percent;
  if (entry.amount != null && total) return entry.amount / total * 100;
  return null;
}

// paid_cash minus whatever the named split entries covered — what we
// actually spent, net of reimbursement/other people's contributions.
function rentalOurPortion(r){
  if (r.paid_cash == null) return null;
  const othersTotal = (r.splits || [])
    .filter(s => s.name)
    .reduce((sum, s) => sum + (splitDollar(s, r.paid_cash) || 0), 0);
  return r.paid_cash - othersTotal;
}

function rentalSplitText(r){
  const splits = (r.splits || []).filter(s => s.name);
  if (!splits.length) return "";
  const total = r.paid_cash;
  return splits.map(s => {
    const dollar = splitDollar(s, total);
    const pct = splitPercent(s, total);
    let val = "";
    if (dollar != null && pct != null) val = ` ${fmtCash(dollar, r.currency)} (${Math.round(pct)}%)`;
    else if (dollar != null) val = ` ${fmtCash(dollar, r.currency)}`;
    else if (pct != null) val = ` ${Math.round(pct)}%`;
    return `${esc(s.name)}${val}`;
  }).join(" &middot; ");
}

// Gathers the 5 name/percent/amount rows from an open form into a splits array.
function gatherSplits(container, prefix){
  const splits = [];
  for (let i = 0; i < SPLIT_SLOTS; i++){
    const name = container.querySelector(`[data-${prefix}-split-name="${i}"]`).value.trim();
    if (!name) continue;
    const pctRaw = container.querySelector(`[data-${prefix}-split-pct="${i}"]`).value;
    const amtRaw = container.querySelector(`[data-${prefix}-split-amt="${i}"]`).value;
    splits.push({
      name,
      percent: pctRaw === "" ? null : parseFloat(pctRaw),
      amount: amtRaw === "" ? null : parseFloat(amtRaw),
    });
  }
  return splits;
}

function fillSplitRows(form, prefix, splits){
  for (let i = 0; i < SPLIT_SLOTS; i++){
    const s = (splits || [])[i] || {};

    form.querySelector(`[data-${prefix}-split-pct="${i}"]`).value = s.percent ?? "";

  }
}
